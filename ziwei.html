<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>별자리 풀이로 보는 나 | 로로</title>
<meta name="robots" content="noindex">
<style>
:root{--ink:#EAE4D6;--gold:#A8853C;--gold-l:#C9A961;--card:#1A2140;--line:#39456E;--muted:#9AA3C6;--app-bg:#0F152A;
--s-bg:#FBF6EA;--s-ink:#2B2A26;--burg:#7C2D3E;--s-line:#D8CDB4}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(120% 90% at 50% 0%,#1A2348 0%,var(--app-bg) 58%,#0B1020 100%);min-height:100vh;color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:break-word}
.app{max-width:680px;margin:0 auto;padding:26px 14px 60px}
h1{font-family:"Apple Myungjo","Nanum Myeongjo",Batang,serif;color:#EAD9A6;font-size:1.4rem;text-align:center;letter-spacing:1px}
.tag{text-align:center;color:var(--gold-l);font-size:.82rem;margin:6px 0 2px}
.hero{position:relative;background:linear-gradient(175deg,#131A32 0%,#1E2A4A 70%,#26325A 100%);border-radius:18px;padding:26px 14px 20px;margin-bottom:14px;overflow:hidden;text-align:center}
.hero .sky{position:absolute;inset:0;pointer-events:none}
.hero .ava{width:72px;height:72px;border-radius:50%;border:2.5px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;box-shadow:0 0 22px rgba(201,169,97,.45);font-size:2rem;background:#0F152A}
.status{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0 0}
.st{font-size:.72rem;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:rgba(0,0,0,.2)}
.st.ok{border-color:#5FAE86;color:#B7E4CC}.st.bad{border-color:#B85C5C;color:#F0B6B6}.st.wait{border-color:var(--gold);color:#EAD9A6}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.panel p.lead{font-size:.94rem;line-height:1.7;margin-bottom:12px}
label{display:block;font-size:.78rem;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=date],input[type=time],textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;font-size:.95rem;background:transparent;color:var(--ink);color-scheme:dark}
select option{background:#1A2140}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold-l)}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chip{padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font-size:.85rem;cursor:pointer;font-family:inherit}
.chip.on{border-color:var(--gold-l);background:rgba(201,169,97,.18);font-weight:700;color:#EAD9A6}
#focus{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#focus .chip{padding:9px 4px;text-align:center;white-space:nowrap}
@media (max-width:380px){#focus{grid-template-columns:repeat(3,1fr)}}
.leap{display:none;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin-top:8px}
.leap.show{display:flex}
.btn{display:block;width:100%;padding:15px;margin-top:14px;font-size:1rem;font-weight:700;color:#141B33;background:linear-gradient(135deg,#E3C77E,#B8934A);border:none;border-radius:11px;cursor:pointer;letter-spacing:1px;box-shadow:0 2px 14px rgba(201,169,97,.28);font-family:inherit}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--gold-l);border:1.5px solid var(--gold-l);box-shadow:none}
.btn.sm{padding:10px;font-size:.88rem;margin-top:8px}
.hint{font-size:.8rem;color:var(--muted);margin-top:8px;line-height:1.6}
.err{color:#E0A8A0;font-size:.85rem;margin-top:8px;line-height:1.5;display:none}
.err.show{display:block}
.rules{border:1px dashed var(--gold-l);border-radius:10px;padding:10px 12px;margin-top:8px}
.rules summary{cursor:pointer;font-size:.84rem;color:#EAD9A6;font-weight:700}
.rules ul{padding-left:16px;margin-top:8px}
.rules li{font-size:.76rem;color:var(--muted);line-height:1.6;margin-bottom:4px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sugg .chip{font-size:.76rem;padding:6px 10px;color:var(--muted)}
.cnt{text-align:right;font-size:.7rem;color:var(--muted);margin-top:3px}
.jasi{margin-top:8px;border:1px dashed var(--gold-l);border-radius:10px;padding:10px 12px}
.jasi .jt{font-size:.8rem;color:#EAD9A6;margin-bottom:6px}
.jasi .jh{font-size:.72rem;color:var(--muted);margin-top:6px;line-height:1.5}
.loading{text-align:center;padding:26px 10px}
.orb{width:48px;height:48px;margin:0 auto 14px;border-radius:50%;border:3px solid var(--gold-l);border-top-color:transparent;animation:spin 1.1s linear infinite;box-shadow:0 0 26px rgba(201,169,97,.5),inset 0 0 14px rgba(201,169,97,.3)}
@keyframes spin{to{transform:rotate(360deg)}}
.load-msg{font-size:.9rem;color:var(--muted);line-height:1.6}
/* 결과지 */
.sheet{background:var(--s-bg);color:var(--s-ink);border:1px solid var(--s-line);border-radius:14px;padding:22px 18px;margin-bottom:14px;box-shadow:0 10px 34px rgba(0,0,0,.5)}
.sheet header{text-align:center;border-bottom:2.5px solid var(--burg);padding-bottom:12px;margin-bottom:12px}
.sheet h2{font-family:"Apple Myungjo","Nanum Myeongjo",Batang,serif;font-size:1.2rem;color:var(--burg);letter-spacing:2px}
.sheet .who{font-size:.78rem;color:#6d6555;margin-top:5px;line-height:1.6}
.ms{display:flex;gap:8px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}
.pil{min-width:64px;background:#fff;border:1.5px solid var(--gold);border-radius:9px;padding:7px 6px;text-align:center}
.pil .pl{font-size:.62rem;color:#8A8272;letter-spacing:1px}
.pil .pv{font-family:"Apple Myungjo",Batang,serif;font-size:1.02rem;font-weight:700;color:var(--burg);margin-top:2px}
.pil .pe{font-size:.62rem;color:var(--gold);margin-top:2px}
.rd{border-radius:10px;padding:13px 12px;background:#fff;margin-top:12px}
.rd.a{border-top:4px solid var(--burg)}.rd.b{border-top:4px solid var(--gold)}
.rd h3{font-family:"Apple Myungjo",Batang,serif;font-size:.92rem;margin-bottom:9px;color:var(--burg)}
.rd.b h3{color:var(--gold)}
.rd h4{font-size:.76rem;margin:10px 0 3px;color:#57503f}
.rd p,.rd li{font-size:.8rem;line-height:1.62}
.rd ol,.rd ul{padding-left:18px}
.basis{display:block;font-size:.64rem;color:#8A8272;margin-top:3px}
.fid{display:inline-block;font-size:.6rem;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:0 6px;margin:0 2px;cursor:pointer}
.fid:hover{background:#F3EDE0}
.fnote{display:block;font-size:.7rem;color:#57503f;background:#F3EDE0;border-radius:6px;padding:6px 8px;margin-top:4px;line-height:1.5}
.ai-off{background:#F3EDE0;border-radius:8px;padding:10px;font-size:.78rem;line-height:1.6;color:#57503f;border-left:3px solid var(--gold)}
.idiom27{text-align:center;margin:12px 0 2px;padding:12px 12px 11px;border:1px solid var(--gold);border-radius:10px;background:#fff}
.idiom27 .il{font-size:.66rem;letter-spacing:1.5px;color:var(--gold)}
.idiom27 .iw{margin-top:3px;font-family:"Apple Myungjo","Nanum Myeongjo",Batang,serif;font-weight:700;color:var(--burg)}
.idiom27 .iw b{font-size:1.5rem;letter-spacing:4px}
.idiom27 .iw span{font-size:.95rem;letter-spacing:3px;color:var(--gold);margin-left:8px;font-weight:400}
.idiom27 .im{font-size:.84rem;margin-top:4px;color:var(--s-ink)}
.idiom27 .ib{font-size:.66rem;color:#8A8272;margin-top:5px;line-height:1.5}
.idiom27 details{margin-top:6px;text-align:left}.idiom27 summary{font-size:.7rem;color:var(--gold);cursor:pointer}
.idiom27 details p{font-size:.74rem;line-height:1.6;margin-top:4px}
/* 인생지도 */
.lm{display:flex;gap:4px;margin:10px 0 6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.seg{flex:1 0 auto;min-width:62px;border:1.5px solid var(--s-line);border-radius:9px;padding:8px 4px;text-align:center;background:#fff;cursor:pointer;font-family:inherit;color:var(--s-ink)}
.seg .sa{font-size:.68rem;color:#8A8272}.seg .sp{font-family:"Apple Myungjo",Batang,serif;font-weight:700;color:var(--burg);font-size:.9rem;margin-top:2px}
.seg.pre{border-style:dashed;background:#F7F2E6}
.seg.cur{border-color:var(--burg);box-shadow:0 0 0 2px rgba(124,45,62,.18)}
.seg.on{background:#F3E6D8}
.lmd{background:#F3EDE0;border-radius:10px;padding:12px;margin-top:6px;font-size:.8rem;line-height:1.62}
.lmd b{color:var(--burg)}
.grid12{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.g{background:#fff;border:1px solid var(--s-line);border-radius:7px;padding:6px 5px;min-height:66px}
.g .gn{font-size:.62rem;color:#8A8272}.g .gn b{color:var(--burg)}
.g .gs{font-size:.7rem;line-height:1.4;margin-top:2px}
.g.soul{border-color:var(--burg)}.g .mut{color:var(--gold)}
@media (max-width:420px){.grid12{grid-template-columns:repeat(3,1fr)}}
details.more summary{font-size:.78rem;color:var(--burg);cursor:pointer;margin-top:10px}
.sfoot{text-align:center;font-size:.66rem;color:#8A8272;margin-top:12px;line-height:1.6}
.hide{display:none}
.sig{margin-top:14px;font-size:.74rem;color:var(--gold-l);letter-spacing:1px;opacity:.8;text-align:center}
.share-promo{margin:16px 0 8px;font-size:13px;line-height:1.8;text-align:center}.sheet .share-promo{padding-top:16px;border-top:1px solid #d9dfe8;color:#4d5970}.privacy-note{margin-top:7px;color:#9cabc5;font-size:11px;line-height:1.7;text-align:center}.privacy-note summary{cursor:pointer}.privacy-note p{margin:8px 0 0;text-align:left}
</style>
</head>

<div class="app">

<div class="hero">
<svg class="sky" viewBox="0 0 400 190" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
<g fill="#EAD9A6"><circle cx="28" cy="30" r="1.4"/><circle cx="60" cy="120" r="1.1"/><circle cx="96" cy="52" r="1.6"/><circle cx="140" cy="22" r="1.1"/><circle cx="330" cy="34" r="1.5"/><circle cx="362" cy="96" r="1.2"/><circle cx="300" cy="140" r="1.3"/><circle cx="44" cy="160" r="1.2"/></g>
<g fill="#C9A961"><path d="M78 84 l2.2 4.6 4.8 .7 -3.5 3.4 .8 4.8 -4.3 -2.3 -4.3 2.3 .8 -4.8 -3.5 -3.4 4.8 -.7 Z"/><path d="M322 66 l2 4.2 4.4 .6 -3.2 3.1 .8 4.4 -4 -2.1 -4 2.1 .8 -4.4 -3.2 -3.1 4.4 -.6 Z" opacity=".85"/></g>
</svg>

<h1>별자리 풀이로 보는 나</h1>
<div class="tag">성격 · 연애 · 일 · 돈</div>

</div>

<!-- 입력 -->
<section id="stepAsk" class="panel">
<p class="lead">자미두수는 별의 상징으로 성격과 운세를 풀이하는 동양 점술이에요.</p>

<details class="rules">
<summary>입력할 때 알아두면 좋은 점</summary>
<ul id="ruleList"></ul>
</details>

<label>별명 (결과지에 표시돼요 · 선택)</label>
<input type="text" id="nick" maxlength="12" placeholder="예: 로로" autocomplete="off">

<label>생년월일 (필수)</label>
<input type="date" id="bdate" min="1900-01-01" max="2100-12-31">
<div class="cats" id="cal">
  <button type="button" class="chip on" data-v="solar">양력</button>
  <button type="button" class="chip" data-v="lunar">음력</button>
</div>
<div class="leap" id="leapRow"><input type="checkbox" id="leap"> <label for="leap" style="margin:0;display:inline">윤달이에요</label> <span id="leapInfo" style="margin-left:6px"></span></div>

<label for="btime">태어난 시각</label>
<input type="time" id="btime" step="60" required aria-label="태어난 시각">
<div class="hint">시와 분을 정확히 입력해 주세요.</div>

<label>성별</label>
<div class="cats" id="gender">
  <button type="button" class="chip on" data-v="여">여성</button>
  <button type="button" class="chip" data-v="남">남성</button>
</div>

<label>어떤 이야기를 듣고 싶어요?</label>
<div class="cats" id="focus">
  <button type="button" class="chip on" data-v="종합">종합</button>
  <button type="button" class="chip" data-v="연애">연애</button>
  <button type="button" class="chip" data-v="일·공부">일·공부</button>
  <button type="button" class="chip" data-v="돈">돈</button>
  <button type="button" class="chip" data-v="사람">사람</button>
</div>

<label>궁금한 질문 (필수 · 500자까지)</label>
<textarea id="concern" maxlength="500" placeholder="예: 이직을 준비해도 괜찮을까요?"></textarea>
<div class="cnt"><span id="ccount">0</span>/500</div>
<div class="sugg" id="sugg"></div>

<button class="btn" id="goBtn">결과 보기</button>
<div class="err" id="askErr"></div>
<p class="hint share-promo">재밌게 보셨나요? 결과를 공유해주시면 추첨을 통해 로로가 작은 선물을 보내드려요.</p>
<details class="privacy-note"><summary>개인정보 안내</summary><p>AI 풀이를 요청하면 입력 정보가 Google Gemini로 전달돼요. 이 페이지는 입력 정보를 따로 보관하지 않아요.</p></details>
</section>

<!-- 로딩 -->
<section id="stepLoad" class="panel loading hide"><div class="orb"></div><div class="load-msg" id="loadMsg">명반을 그리고 있어요…</div></section>

<!-- 결과 -->
<section id="stepOut" class="hide"></section>

<div class="sig">살림안하는 로로</div>
</div>

家宅不安人口退，田蚕不利主人衰，嫁娶婚姻皆自损，金银财谷渐无之，若是开门并放水，牛猪羊马亦伤悲。","{xx.nv}":"女星造作损婆娘，兄弟相嫌似虎狼，埋葬生灾逢鬼怪，颠邪疾病主瘟惶，为事遭官财失散，泻利留连不可当，开门放水用此日，全家财散主离乡。","{xx.xu}":"虚星造作主灾殃，男女孤眠不一双，内乱风声无礼节，儿孙媳妇伴人床，开门放水遭灾祸，虎咬蛇伤又卒亡，三三五五连年病，家破人亡不可当。","{xx.wei}":"危星不可造高楼，自遭刑吊见血光，三年孩子遭水厄，后生出外永不还，埋葬若还逢此日，周年百日取高堂，三年两载一悲伤，开门放水到官堂。","{xx.shi}":"室星修造进田牛，儿孙代代近王侯，家贵荣华天上至，寿如彭祖八千秋，开门放水招财帛，和合婚姻生贵儿，埋葬若能依此日，门庭兴旺福无休。","{xx.qiang}":"壁星造作主增财，丝蚕大熟福滔天，奴婢自来人口进，开门放水出英贤，埋葬招财官品进，家中诸事乐陶然，婚姻吉利主贵子，早播名誉著祖鞭。","{xx.kui}":"奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。","{xx.lou}":"娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。","{xx.vei}":"胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。","{xx.mao}":"昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。","{xx.bi}":"毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。","{xx.zi}":"觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。","{xx.can}":"参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。","{xx.jing}":"井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。","{xx.gui}":"鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。","{xx.liu}":"柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。","{xx.xing}":"星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。","{xx.zhang}":"张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。","{xx.yi}":"翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。","{xx.zhen}":"轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻龙子入龙宫。"},s.ZHENG={"{xx.jiao}":"{wx.mu}","{xx.jing}":"{wx.mu}","{xx.kui}":"{wx.mu}","{xx.dou}":"{wx.mu}","{xx.kang}":"{wx.jin}","{xx.gui}":"{wx.jin}","{xx.lou}":"{wx.jin}","{xx.niu}":"{wx.jin}","{xx.di}":"{wx.tu}","{xx.liu}":"{wx.tu}","{xx.vei}":"{wx.tu}","{xx.nv}":"{wx.tu}","{xx.fang}":"{wx.ri}","{xx.xing}":"{wx.ri}","{xx.mao}":"{wx.ri}","{xx.xu}":"{wx.ri}","{xx.xin}":"{wx.yue}","{xx.zhang}":"{wx.yue}","{xx.bi}":"{wx.yue}","{xx.wei}":"{wx.yue}","{xx.tail}":"{wx.huo}","{ /* 2027 정미년 사자성어 v2 (규칙 2027.v2)
   - 이 블록은 api/mysaju.js(서버)와 mysaju.html(화면)에 글자 하나까지 같게 들어갑니다. 생성기: tools/y2027/build_v2.py (진실 원천 data_v2.py)
   - 규칙: 일간(10) × 신강/신약(2) × 2027 지지 미(未)와 일지·월지의 관계(6) × 오행 보완(2) = 240칸 중 규칙상 나올 수 있는 225칸, 칸마다 서로 다른 성어 1개
   - 결정성: 현재 날짜·난수·기기·이름·조회일을 쓰지 않음. 같은 (양력 생년월일, 시간, 자시 설정)이면 항상 같은 결과

var LOLO2027=(function(){
"use strict";
var YEAR=2027, RULE="2027.v2", SE_STEM=3 /* 정(丁) */, SE_BR=7 /* 미(未) */;
var STEMS="갑을병정무기경신임계", BRS="자축인묘진사오미신유술해";

var HJS="甲乙丙丁戊己庚辛壬癸", HJB="子丑寅卯辰巳午未申酉戌亥";

 return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function sajuMonth(m,d){var mk=m*100+d;
  if(mk<=105)return 11; if(mk<=203)return 12; if(mk<=305)return 1; if(mk<=404)return 2; if(mk<=505)return 3; if(mk<=605)return 4;

function isJasi(timeStr){if(!timeStr)return false;var a=timeStr.split(":").map(Number);return a[0]*60+a[1]>=23*60+30;}
function fourPillars(dateStr,timeStr,jasi){
  var p=dateStr.split("-").map(Number),y=p[0],m=p[1],d=p[2];
  var yy=y; if(m<2||(m===2&&d<4))yy=y-1;
  var ys=((yy-4)%10+10)%10, yb=((yy-4)%12+12)%12;
  var sm=sajuMonth(m,d); var mb=(2+(sm-1))%12; var mStart=((ys%5)*2+2)%10; var ms=(mStart+(sm-1))%10;
  var night=isJasi(timeStr), shift=(night&&jasi!=="ya")?1:0;

}
/* ── 2) 십신 ── */
function sinsin(dayS,s){var E="목화토금수";var i=E.indexOf(SEL[dayS]),k=E.indexOf(SEL[s]);var rel=(k-i+5)%5;var same=(dayS%2)===(s%2);var base=[0,2,4,6,8][rel];return SIN[same?base:base+1];}

function strength(P){

  function helps(s){var r=sinsin(P.d.s,s);return r==="비견"||r==="겁재"||r==="편인"||r==="정인";}
  if(helps(BR_MAIN[P.m.b])){score+=3;parts.push("월지 "+BRS[P.m.b]+" +3");}
  if(helps(BR_MAIN[P.d.b])){score+=2;parts.push("일지 "+BRS[P.d.b]+" +2");}
  if(P.h&&helps(BR_MAIN[P.h.b])){score+=1;parts.push("시지 "+BRS[P.h.b]+" +1");}
  if(helps(BR_MAIN[P.y.b])){score+=1;parts.push("연지 "+BRS[P.y.b]+" +1");}
  if(helps(P.y.s)){score+=1;parts.push("연간 "+STEMS[P.y.s]+" +1");}
  if(helps(P.m.s)){score+=1;parts.push("월간 "+STEMS[P.m.s]+" +1");}
  if(P.h&&helps(P.h.s)){score+=1;parts.push("시간 "+STEMS[P.h.s]+" +1");}

/* ── 4) 2027 지지 미(未)와 일지·월지의 관계: 축 충 / 술 형·파 / 자 해 / 오 육합 / 묘·해 반합(함께 있으면 삼합) / 미 같음 / 그 외 없음. 우선순위 충>형파>해>합>같음>없음, 같은 급이면 둘 다 표기 ── */
var REL_OF={1:"충",10:"형파",0:"해",6:"합",3:"합",11:"합",7:"같음"};

function relation(P){

  for(i=0;i<cands.length;i++){c=cands[i];cls=REL_OF[c.b]||"없음";if(best===null||REL_PRI[cls]<REL_PRI[best.cls])best={cls:cls,list:[c]};else if(cls===best.cls&&cls!=="없음")best.list.push(c);}

  if(best.cls==="합"&&brs.indexOf("묘")>=0&&brs.indexOf("해")>=0)kinds=["삼합(三合)"];
  var last=brs.length?brs[brs.length-1]:"";
  return {cls:best.cls, kind:kinds.join("·"), src:best.list.map(function(x){return x.src;}).join("·"), branches:brs,
          srcText:best.cls==="없음"?"일지·월지":srcs.join("·"), wa:last?(hasJong(last)?"과":"와"):"와"};
}
/* ── 5) 오행 분포(천간·지지 각 1): 화 또는 토가 0개면 2027 정미(丁未, 화·토)가 그 빈자리를 채움 ── */
function elements(P){

 실제 과제에 적용해 보세요.","work":"내 기운이 센 편으로 분류된 데에 배움과 지원의 주제가 더해져요. 자료를 더 모으는 일만 반복하기보다 이미 배운 방법 하나를 실제로 써 보는 쪽에 힘을 실어 보세요."},"약":{"push":"막히는 절차 하나의 예시나 안내 자료를 담당자에게 요청해 보세요.","work":"내 기운이 약한 편으로 분류됐다면 배움과 지원을 기본기를 보태는 방법으로 읽어요. 혼자 오래 막혀 있기보다 예시 자료나 구체적인 도움부터 확보해 보세요."}},"재성":{"강":{"push":"관심 있는 일 두 가지의 시간과 비용을 비교해 하나를 골라 보세요.","work":"내 기운이 센 편으로 분류됐다면 돈과 일감을 직접 관리하는 주제를 살펴보는 흐름으로 읽어요. 기회가 여럿이어도 동시에 맡을 일의 수와 비용 상한을 정해 두세요."},"약":{"push":"큰 제안을 바로 받기보다 기간이나 규모를 줄여 시험할 수 있는지 물어보세요.","work":"내 기운이 약한 편으로 분류됐다면 기회나 일감이 늘 때 따라오는 부담도 함께 살펴요. 제안의 규모를 줄이고 이미 맡은 일과 예산을 먼저 지키는 기준을 세워 보세요."}}},"themes":{"겁재":{"action":"다음 공동 지출이나 모임 하나의 비용 분담 방식을 참여자에게 메시지로 확인해 보세요.","headline":"경쟁의 속도보다 내 몫과 협력의 기준부터","lead":"겁재는 전통적으로 경쟁하는 상대와 함께하는 동료를 뜻하며, 역할과 몫을 어떻게 나눌지 살피는 주제로 읽어요.","money":"함께 내는 돈은 금액뿐 아니라 남은 돈을 어떻게 돌려줄지도 정해 두세요. 경쟁하듯 소비하게 되는 자리에서는 내가 쓸 한도를 먼저 정해 보세요.","people":"상대의 성과를 내 가치와 바로 비교하지 않아도 괜찮아요. 서운한 몫이 있다면 누가 더 애썼는지 따지기보다 다음에 어떻게 나눌지 이야기해 보세요.","push":"서로 다른 장점을 가진 사람과 역할을 나눠 보세요.","reduce":"뒤처지기 싫어서 원하지 않는 약속까지 잡는 일을 줄여 보세요.","work":"비슷한 목표를 가진 사람의 방법에서 배울 점을 찾아보세요. 팀을 고를 때는 친분만 보기보다 역할과 결과를 나누는 기준이 분명한지 확인해 보세요."},"비견":{"action":"이번 주 함께할 일 하나를 골라 내가 정할 부분과 같이 정할 부분을 종이에 나눠 적어 보세요.","headline":"내 기준은 또렷하게, 함께할 일은 유연하게","lead":"비견은 전통적으로 나와 비슷한 힘을 뜻하며, 내 기준을 세우고 스스로 선택하는 주제로 읽어요.","money":"내가 중요하게 여기는 지출과 남을 따라 하는 지출을 나눠 보세요. 같이 돈을 쓰는 일은 각자 낼 금액을 먼저 정하는 편이 좋아요.","people":"내가 원하는 것을 말하되 상대도 다르게 고를 수 있다는 여지를 남겨 주세요. 가까운 사이라도 혼자 보내는 시간과 함께할 시간을 구분해 보세요.","push":"내가 끝까지 맡을 수 있는 일 하나를 직접 결정해 보세요.","reduce":"다른 방식이라는 이유만으로 상대의 제안을 밀어내는 말을 줄여 보세요.","work":"혼자 책임질 수 있는 일을 정하면 내 방식의 장점을 살리기 좋아요. 함께하는 과제에서는 방법을 모두 통일하기보다 마감과 완성 기준부터 맞춰 보세요."},"상관":{"action":"바꾸고 싶은 방식 하나를 골라 문제점과 대안을 각각 한 문장으로 써 보세요.","headline":"새로운 생각은 선명하게, 전달 방식은 차분하게","lead":"상관은 전통적으로 생각을 밖으로 표현하고 익숙한 방식을 바꾸되, 규칙과 어떻게 조율할지 살피는 주제로 읽어요.","money":"직접 만든 것에 돈을 쓰기 전에는 꼭 필요한 비용과 꾸미기 위한 비용을 나눠 보세요. 눈에 띄는 홍보 문구보다 실제 제공 내용과 추가 비용을 확인해 보세요.","people":"솔직한 말도 상대가 받아들일 수 있는 때와 표현을 고르면 더 잘 전달돼요. 사람 전체를 평가하기보다 내가 불편했던 말이나 행동 하나를 짚어 주세요.","push":"다른 사람이 이해할 수 있는 예시를 붙여 내 생각을 제안해 보세요.","reduce":"사람들 앞에서 바로 반박하거나 빈정대는 말을 줄여 보세요.","work":"불편한 점을 찾았다면 비판만 하기보다 바꿀 방법 하나를 붙여 보세요. 새 방식을 제안할 때는 바꿔도 되는 범위와 반드시 지켜야 할 기준을 먼저 확인해 보세요."},"식신":{"action":"손에 있는 도구만 써서 20분 안에 끝낼 수 있는 결과물 하나를 만들어 보세요.","headline":"잘하는 일을 작게 쌓아 눈에 보이는 결과로","lead":"식신은 전통적으로 재능을 꾸준히 써서 무언가를 만들고 일상을 돌보는 주제로 읽어요.","money":"자주 쓰는 물건은 가격만 보지 말고 실제 사용 횟수와 관리 비용을 함께 살펴보세요. 잘할 수 있는 일에 돈을 쓰더라도 지금 필요한 도구부터 골라 보세요.","people":"거창한 표현보다 상대가 부탁한 작은 일을 지키는 방식으로 마음을 전해 보세요. 다만 챙겨 주는 일이 내 몫으로 굳어지지 않도록 원하는 도움도 말해 주세요.","push":"이미 할 줄 아는 일을 완성품 하나로 남겨 보세요.","reduce":"도구를 더 사야 시작할 수 있다는 생각을 줄여 보세요.","work":"한 번에 크게 해내기보다 매번 남길 결과물의 크기를 정해 보세요. 공부라면 문제 몇 개, 일이라면 초안 한 쪽처럼 반복할 수 있는 단위가 좋아요."},"정관":{"action":"가장 가까운 제출이나 신청 하나의 마감일, 필수 자료, 제출 방법을 한곳에 적어 보세요.","headline":"맡은 일을 분명히 할수록 신뢰도 차곡차곡","lead":"정관은 전통적으로 책임과 약속, 자격과 절차를 통해 신뢰를 쌓는 주제로 읽어요.","money":"지급일과 납부일을 달력에 표시해 빠뜨리는 비용을 줄여 보세요. 신청이나 구매에 조건이 붙어 있다면 금액뿐 아니라 내가 충족해야 할 항목도 확인해 보세요.","people":"관계에서 중요하게 여기는 약속을 상대가 알아서 알 것이라 넘기지 말고 말해 주세요. 예의를 지키는 것과 늘 상대의 기대에 맞추는 것은 달라도 괜찮아요.","push":"다른 사람이 확인할 수 있는 완료 기준을 세워 보세요.","reduce":"책임감 때문에 내 역할 밖의 부탁까지 모두 떠안는 일을 줄여 보세요.","work":"과제나 업무를 시작할 때 제출 조건과 평가 기준을 먼저 읽어 보세요. 책임을 맡는다면 결정할 수 있는 범위와 도움받을 곳도 함께 확인하는 편이 좋아요."},"정인":{"action":"오늘 배운 내용 하나를 자료를 덮고 세 문장으로 설명한 뒤, 틀린 부분만 다시 확인해 보세요.","headline":"배운 것을 내 말로 정리하며 기본기를 단단히","lead":"정인은 전통적으로 배움과 도움을 받아 기본기를 익히고 나를 뒷받침할 바탕을 만드는 주제로 읽어요.","money":"강의나 책을 고를 때는 유명한지보다 지금의 질문을 해결하는지 확인해 보세요. 이미 가진 자료에서 필요한 내용을 찾을 수 있는지도 먼저 살펴보세요.","people":"도움을 받았다면 무엇이 도움이 됐는지 구체적으로 전해 보세요. 조언을 존중하되 마지막 선택까지 상대에게 맡기지는 않아도 괜찮아요.","push":"반복해서 막히는 기초 개념 하나를 제대로 이해해 보세요.","reduce":"누군가의 허락이나 확신이 생길 때까지 선택을 미루는 일을 줄여 보세요.","work":"막히는 내용이 있다면 자료를 더 모으기 전에 어디부터 이해되지 않는지 짚어 보세요. 배운 내용을 내 말로 설명할 수 있는지 확인하면 다음에 공부할 부분이 보여요."},"정재":{"action":"최근 결제 내역에서 정기 결제 하나를 골라 다음 결제일과 실제 사용 여부를 확인해 보세요.","headline":"꾸준히 지킬 수 있는 예산이 선택을 편하게","lead":"정재는 전통적으로 반복해서 들어오고 나가는 돈과 자원을 성실하게 관리하는 주제로 읽어요.","money":"정기적으로 들어오는 돈 안에서 꼭 나갈 돈을 먼저 빼고 쓸 금액을 정해 보세요. 할인 폭이 커도 원래 살 계획이 없었다면 구매를 미뤄도 괜찮아요.","people":"관계를 위해 쓰는 돈과 시간을 내가 감당할 수 있는 범위에서 정해 보세요. 성의의 크기를 가격으로 재기보다 서로 편한 만남 방식을 찾아보세요.","push":"지금 생활에 맞는 현실적인 주간 예산을 지켜 보세요.","reduce":"작은 금액이라 확인하지 않고 계속 결제하는 일을 줄여 보세요.","work":"큰 계획보다 매주 지킬 일정과 끝내야 할 분량을 구체적으로 잡아 보세요. 일을 맡을 때는 보상뿐 아니라 반복되는 업무량과 필요한 시간을 함께 따져 보세요."},"편관":{"action":"가장 부담되는 과제 하나에서 막히는 점을 한 줄로 적고, 물어볼 사람에게 질문 하나를 보내 보세요.","headline":"어려운 과제 앞에서는 용기와 대비를 함께","lead":"편관은 전통적으로 도전과 압박을 다루며 어려운 상황에 어떻게 대비할지 살피는 주제로 읽어요.","money":"급하게 결제하라는 요청을 받으면 이유와 기한부터 확인해 보세요. 예상 밖 지출에 쓸 수 있는 금액을 따로 정하면 다른 생활비를 흔들지 않고 판단하기 쉬워요.","people":"강한 말에 바로 맞서거나 무조건 따르기보다 받아들일 수 있는 범위를 말해 주세요. 불편한 부탁에는 답할 시간을 요청해도 괜찮아요.","push":"부담되는 일의 가장 작은 첫 단계를 실행해 보세요.","reduce":"촉박하다는 이유만으로 모든 요청에 즉시 답하는 습관을 줄여 보세요.","work":"부담이 큰 목표는 바로 해결할 부분과 도움받을 부분으로 나눠 보세요. 빨리 끝내라는 요구가 있어도 생략하면 안 되는 확인 절차는 남겨 두세요."},"편인":{"action":"궁금한 주장 하나를 골라 처음 나온 자료와 작성 날짜를 확인해 보세요.","headline":"낯선 관점은 열어 두고 확인할 근거는 가까이","lead":"편인은 전통적으로 낯선 배움과 직관, 익숙한 문제를 다른 각도에서 보는 주제로 읽어요.","money":"희소하거나 특별하다는 설명에 끌릴수록 사용 목적과 실제 구성을 확인해 보세요. 처음 접하는 서비스는 오래 묶이는 결제보다 짧게 써 볼 수 있는지 살펴보세요.","people":"상대의 뜻을 짐작했더라도 사실처럼 단정하기 전에 한 번 물어보세요. 혼자 생각할 시간이 필요하다면 연락을 피하기보다 언제 다시 이야기할지 알려 주세요.","push":"익숙한 문제에 다른 분야의 방법 하나를 적용해 보세요.","reduce":"상대의 짧은 반응에 여러 숨은 뜻을 붙이는 일을 줄여 보세요.","work":"평소와 다른 분야의 방법을 가져오되 지금 과제에 쓸 수 있는 부분만 작게 시험해 보세요. 느낌이 좋다는 이유만으로 바꾸기보다 기존 방식과 결과를 비교할 기준을 정해 보세요."},"편재":{"action":"관심 있는 제안 하나의 시작 비용, 주당 소요 시간, 취소 조건을 세 줄로 적어 보세요.","headline":"새 기회는 넓게 보되 쓸 수 있는 한도 안에서","lead":"편재는 전통적으로 바깥의 기회와 거래를 살피며 돈과 시간, 사람을 어떻게 배분할지 생각하는 주제로 읽어요.","money":"새 제안을 볼 때 비용 상한과 취소할 수 있는 조건을 먼저 정해 보세요. 기대하는 이익만 듣지 말고 추가로 들어갈 돈과 시간을 확인해 보세요.","people":"여러 사람과 알아가는 즐거움과 한 사람에게 지킬 약속을 구분해 보세요. 가볍게 한 말도 상대에게는 약속으로 들릴 수 있으니 가능한 범위를 분명히 말해 주세요.","push":"관심 있는 기회 두 가지를 같은 기준으로 비교해 보세요.","reduce":"놓치기 아까워서 확인하지 않은 제안까지 받아들이는 일을 줄여 보세요.","work":"여러 제안을 볼 때는 흥미뿐 아니라 준비 시간과 실제 맡을 역할을 함께 비교해 보세요. 새 일을 하나 고르면 기존 일 중 무엇을 줄일지도 정하는 편이 좋아요."}}},"STEM_DESC":{"갑":"갑목(甲木, 큰 나무)","경":"경금(庚金, function compute(dateStr,timeStr,opts){

  var dateParts2027=dateStr.split("-").map(Number), gy=dateParts2027[0], gm=dateParts2027[1], gd=dateParts2027[2];
  var leap2027=(gy%4===0&&gy%100!==0)||gy%400===0;

var SUGG={'종합':['내 성격의 장단점이 궁금해요','어떤 일이 잘 맞을까요?','연애할 때 어떤 스타일인가요?'],'연애':['연애할 때 어떤 점을 조심하면 좋을까요?','나와 잘 맞는 관계는 어떤 모습인가요?','지금 관계에서 무엇부터 생각해볼까요?'],'일·공부':['이직을 준비해도 괜찮을까요?','내 강점을 살릴 수 있는 일은 뭘까요?','공부 습관을 어떻게 바꾸면 좋을까요?'],'돈':['돈 관리에서 어떤 습관을 점검하면 좋을까요?','소비할 때 어떤 점을 조심하면 좋을까요?','수입과 지출을 어떻게 살펴보면 좋을까요?'],'사람':['친구와 자꾸 부딪힐 때 무엇을 살펴볼까요?','일할 때 어떤 사람과 잘 맞을까요?','관계에서 나에게 필요한 기준이 궁금해요']};
function suggest(){var host=$('#sugg');host.innerHTML='';(SUGG[state.focus]||[]).forEach(function(q){var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=q;b.onclick=function(){$('#concern').value=q;$('#ccount').textContent=q.length};host.appendChild(b)})}
suggest();$('#concern').addEventListener('input',function(){$('#ccount').textContent=this.value.length});
if(CORE){['한국에서 태어난 분을 기준으로 계산해요.','양력·음력과 윤달 여부는 기록된 생일에 맞춰 골라 주세요.','태어난 시각이 있어야 개인별 결과를 만들 수 있어요.','인생지도의 나이는 만 나이예요. 80세는 표시 범위일 뿐 수명 예측이 아니에요.'].forEach(function(t){var li=document.createElement('li');li.textContent=t;$('#ruleList').appendChild(li)})}
$('#btime').addEventListener('input',function(){$('#askErr').classList.remove('show')});
function collect(){var date=$('#bdate').value,time=$('#btime').value,concern=$('#concern').value.trim();if(!date)return {error:'생년월일을 입력해 주세요.'};if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(time))return {error:'태어난 시각을 시·분까지 입력해 주세요.'};if(concern.length<2)return {error:'궁금한 질문을 입력해 주세요.'};return {input:{calendar:state.cal,date:date,isLeap:state.cal==='lunar'&&$('#leap').checked,timeMode:'exact',time:time,gender:state.gender},focus:state.focus,concern:concern,nickname:$('#nick').value.trim()}}
$('#goBtn').onclick=async function(){if(state.busy)return;$('#askErr').classList.remove('show');if(!CORE)return err('계산 기능을 불러오지 못했어요. 파일을 다시 열어 주세요.');var req=collect();if(req.error)return err(req.error);var r,F,y;try{r=CORE.resolve(req.input);if(!r.ok)return err(r.error);if(!r.chart)throw new Error('정확한 출생 시각이 필요해요.');F=CORE.extractFacts(r.chart,{targetYear:2027});y=Y.compute(r.solar,req.input.time,CORE.POLICY.dayDivide)}catch(e){return err('입력한 생일과 시각을 다시 확인해 주세요. 지원 범위를 벗어나면 결과를 만들지 않아요.')}var m={req:req,F:F,y27:y,ai:{status:'pending'}};var key=JSON.stringify(req);if(state.cache[key]){m.ai=state.cache[key];state.last=m;render(m);return}state.busy=true;this.disabled=true;show('#stepLoad');$('#loadMsg').textContent='결과를 정리하고 있어요. 잠시 기다려 주세요.';try{var res=await fetch('api/ziwei-interpret',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(req)});var j=await res.json();m.ai=j.ok?(j.ai||{status:'error'}):{status:'error',reason:j.error};if(m.ai.status==='ok')state.cache[key]=m.ai}catch(e){m.ai={status:'unavailable'}}finally{state.busy=false;$('#goBtn').disabled=false;state.last=m;render(m)}};
function ageText(a){return a[0]===a[1]?a[0]+'세':a[0]+'~'+a[1]+'세'}
function paragraph(v){return '<p>'+esc(typeof v==='string'?v:v&&v.text||'')+'</p>'}
function list(a){return '<ul>'+(a||[]).map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>'}
function idiom(y){if(!y||y.status!=='ok')return '<div class="rd b"><h3>2027년의 한마디</h3><p>같은 기준의 사자성어를 확인하지 못해 표시를 보류했어요.</p></div>';return '<div class="idiom27"><div class="il">'+esc(Y.SOURCE_LABEL)+'</div><div class="iw"><b>'+esc(y.idiom)+'</b><span>'+esc(y.hanja)+'</span></div><div class="im">'+esc(y.meaning)+'</div></div>'}
function render(m){var req=m.req,F=m.F,L=F.lifemap,ok=m.ai.status==='ok',d=ok?m.ai.result:null;var title=req.nickname?req.nickname+'님의 결과':'나의 결과';var h='<div class="sheet"><header><h2>'+esc(title)+'</h2><div class="who">'+esc(req.input.date)+' · '+esc(req.input.time)+' · '+esc(req.focus)+'</div></header>';
if(ok){h+='<div class="rd a"><h3>질문에 대한 답변</h3>'+paragraph(d.understand)+'</div>';h+='<div class="rd b"><h3>내 성격과 습관</h3>'+(d.traits||[]).map(paragraph).join('')+'<h4>조심하면 좋은 습관</h4>'+(d.patterns||[]).map(paragraph).join('')+'</div>';h+='<div class="rd a"><h3>'+esc(req.focus==='종합'?'질문을 조금 더 살펴보면':req.focus+'에 관해')+'</h3>'+paragraph(d.deep)+'<h4>확인해볼 점</h4>'+list(d.deep.conditions)+'<h4>해볼 만한 것</h4>'+list(d.deep.actions)+'</div>'}else{h+='<div class="rd a"><h3>질문에 대한 답변</h3><p>풀이 기능이 아직 연결되지 않아 답변을 보여드릴 수 없어요.</p><p class="basis">지금은 입력 화면·시기별 참고 주제·사자성어만 확인할 수 있어요. 개인별 답변은 연결 후 표시돼요.</p></div>'}
h+='<div class="rd b"><h3>0~80세, 시기별 참고 주제</h3><p class="basis">각 시기를 눌러보세요. 만 나이 기준이며, 경계가 생일 사이에 있으면 같은 나이가 두 구간에 걸칠 수 있어요.</p><div class="lm" id="lm"><button type="button" class="seg pre" data-i="pre"><div class="sa">'+ageText(L.preFirst.manApprox)+'</div><div class="sp">어린 시절</div></button>';
L.decades.forEach(function(p,i){h+='<button type="button" class="seg'+(p.isCurrent?' cur':'')+'" data-i="'+i+'"><div class="sa">'+ageText(p.manApprox)+'</div><div class="sp">'+esc(LABELS[p.palace]||'참고 주제')+'</div></button>'});h+='</div><div class="lmd" id="lmd"></div><p class="basis">시기별 주제는 전통 점술의 해석 틀이에요. 실제 사건이나 수명을 정해주는 것은 아니에요.</p></div>';
if(ok&&d.now)h+='<details class="more"><summary>2027년 참고할 점</summary><div class="rd">'+paragraph(d.now)+'</div></details>';
h+=idiom(m.y27)+'<p class="share-promo">재밌게 보셨나요? 결과를 공유해주시면 추첨을 통해 로로가 작은 선물을 보내드려요.</p><p class="sfoot">재미로 보는 운세예요. 중요한 결정은 현실의 정보와 함께 판단해 주세요.</p></div><button class="btn ghost" id="againBtn">다시 입력하기</button>';$('#stepOut').innerHTML=h;show('#stepOut');$('#againBtn').onclick=function(){show('#stepAsk')};document.querySelectorAll('#lm .seg').forEach(function(b){b.onclick=function(){document.querySelectorAll('#lm .seg').forEach(function(x){x.classList.remove('on')});b.classList.add('on');showPeriod(b.dataset.i,m)}});var current=document.querySelector('#lm .seg.cur')||document.querySelector('#lm .seg');if(current)current.click()}
function showPeriod(index,m){var L=m.F.lifemap,host=$('#lmd');if(index==='pre'){host.innerHTML='<b>'+ageText(L.preFirst.manApprox)+' · 어린 시절</b><p>이후의 시기와 구분해서 표시한 구간이에요.</p>';return}var i=Number(index),p=L.decades[i];if(!p)return;var note=m.ai.status==='ok'&&Array.isArray(m.ai.result.periods)?m.ai.result.periods.find(function(x){return x.index===i}):null;host.innerHTML='<b>'+ageText(p.manApprox)+' · '+esc(LABELS[p.palace]||'참고 주제')+'</b><p>'+(note?esc(note.text):'전통 풀이에서 이 시기의 참고 주제로 분류한 항목이에요. 개인별 설명은 아직 준비 중이에요.')+'</p>'}
})();
</script>
