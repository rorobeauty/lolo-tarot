<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두 명의 타로 리더가 읽는 나의 선택</title>
<style>
:root{--ivory:#FAF6EC;--ink:#EAE4D6;--navy:#1E2A4A;--gold:#A8853C;--gold-l:#C9A961;--card:#1A2140;--line:#39456E;--muted:#9AA3C6;--app-bg:#0F152A}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(120% 90% at 50% 0%,#1A2348 0%,var(--app-bg) 58%,#0B1020 100%);min-height:100vh;color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.app{max-width:640px;margin:0 auto;padding:26px 14px 60px}
h1{font-family:"Apple Myungjo","Nanum Myeongjo",Batang,serif;color:var(--navy);font-size:1.45rem;text-align:center;letter-spacing:1px}
.tag{text-align:center;color:var(--gold);font-size:.82rem;margin:6px 0 20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.panel p.lead{font-size:.94rem;line-height:1.7;margin-bottom:12px}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:.95rem;background:transparent;color:var(--ink);resize:vertical}
textarea:focus{outline:2px solid var(--gold-l)}
.btn{display:block;width:100%;padding:15px;margin-top:12px;font-size:1rem;font-weight:700;color:#141B33;background:linear-gradient(135deg,#E3C77E,#B8934A);border:none;border-radius:11px;cursor:pointer;letter-spacing:1px;box-shadow:0 2px 14px rgba(201,169,97,.28)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--gold-l);border:1.5px solid var(--gold-l);box-shadow:none}
.hint{font-size:.8rem;color:var(--muted);margin-top:8px;line-height:1.6}
.err{color:#B5432A;font-size:.85rem;margin-top:10px;line-height:1.6;display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;margin-top:12px}
.num{position:relative;aspect-ratio:1;border:1.5px solid var(--line);border-radius:9px;background:transparent;color:var(--ink);font-size:.92rem;font-weight:600;cursor:pointer}
.num.sel{border-color:var(--gold-l);background:rgba(201,169,97,.18)}
.num.sel::after{content:attr(data-ord);position:absolute;top:-7px;right:-7px;width:19px;height:19px;border-radius:50%;background:#C9A961;color:#141B33;font-size:.68rem;line-height:19px;text-align:center}
.pick-legend{font-size:.8rem;color:var(--muted);margin-top:10px}
.loading{text-align:center;padding:26px 10px}
.orb{width:48px;height:48px;margin:0 auto 14px;border-radius:50%;border:3px solid var(--gold-l);border-top-color:transparent;animation:spin 1.1s linear infinite;box-shadow:0 0 26px rgba(201,169,97,.5),inset 0 0 14px rgba(201,169,97,.3)}
@keyframes spin{to{transform:rotate(360deg)}}
.load-msg{font-size:.9rem;color:var(--muted)}
/* ── 결과 시트 ── */
.sheet{background:#FAF6EC;color:#2A2722;border:1px solid #D8CDB4;border-radius:14px;padding:22px 18px;margin-bottom:14px;box-shadow:0 10px 34px rgba(0,0,0,.5)}
.sheet header{text-align:center;border-bottom:2px solid #A8853C;padding-bottom:10px;margin-bottom:14px}
.sheet h2{font-family:"Apple Myungjo","Nanum Myeongjo",Batang,serif;font-size:1.15rem;color:#1E2A4A;letter-spacing:1px}
.sheet .q{margin-top:6px;font-size:.88rem}
.sheet .q b{display:inline-block;font-size:.72rem;color:#A8853C;border:1px solid #A8853C;border-radius:8px;padding:1px 8px;margin-right:6px;font-weight:600;vertical-align:1px}
.crow{display:flex;justify-content:center;gap:12px;margin-bottom:6px}
.cslot{text-align:center;width:31%;max-width:130px}
.pos{font-size:.72rem;font-weight:700;color:#1E2A4A;letter-spacing:2px;margin-bottom:5px}
.cframe{filter:drop-shadow(0 3px 8px rgba(0,0,0,.28))}
.cframe svg{display:block;width:100%;height:auto}
.cname{margin-top:5px;font-size:.82rem;font-weight:700}
.cdir{font-size:.7rem;color:#A8853C}
.inote{text-align:center;font-size:.68rem;color:#8A8272;margin:8px 0 14px}
.rwrap{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.rd{flex:1;min-width:240px;border-radius:9px;padding:12px 13px}
.rd.a{background:#F1EBDC;border-top:3px solid #1E2A4A}
.rd.b{background:#EDEFF4;border-top:3px solid #A8853C}
.rd h3{font-family:"Apple Myungjo","Nanum Myeongjo",Batang,serif;font-size:.92rem;margin-bottom:8px;color:#1E2A4A}
.rd.b h3{color:#8a6c22}
.rd h4{font-size:.8rem;color:#1E2A4A;margin:8px 0 3px}
.rd.b h4{color:#6E5A28}
.rd p{font-size:.82rem;line-height:1.55}
.basis{display:block;font-size:.7rem;color:#7A7364;margin-top:2px}
.syn{background:#1E2A4A;color:#F2EFE6;border-radius:9px;padding:13px 14px}
.syn h3{font-family:"Apple Myungjo","Nanum Myeongjo",Batang,serif;font-size:.92rem;color:#C9A961;margin-bottom:8px}
.syn h4{font-size:.8rem;color:#C9A961;margin:8px 0 3px}
.syn p,.syn li{font-size:.82rem;line-height:1.55}
.syn ol{padding-left:18px}
.sfoot{text-align:center;font-size:.68rem;color:#8A8272;margin-top:12px}
.actions{display:flex;gap:10px}
.actions .btn{flex:1;margin-top:0}
.notice{background:rgba(201,169,97,.12);border:1px solid var(--gold-l);border-radius:10px;padding:12px;font-size:.85rem;line-height:1.6;margin-bottom:12px}
.hide{display:none}
.hero{position:relative;background:linear-gradient(175deg,#131A32 0%,#1E2A4A 70%,#26325A 100%);border-radius:18px;padding:26px 14px 20px;margin-bottom:16px;overflow:hidden;text-align:center}
.hero h1{color:#EAD9A6}
.hero .tag{color:#C9A961;margin-bottom:2px}
.hero .sky{position:absolute;inset:0;pointer-events:none}
.orbit{transform-origin:66px 58px;animation:orb 36s linear infinite}
@keyframes orb{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.orbit{animation:none}}
.ava-wrap{position:relative;width:132px;height:118px;margin:0 auto 8px}
.ava-wrap .ava{position:absolute;left:22px;top:14px;margin:0;box-shadow:0 0 22px rgba(201,169,97,.45)}
.ava-wrap .deco{position:absolute;inset:0;pointer-events:none}
.ava{width:88px;height:88px;border-radius:50%;border:2.5px solid var(--gold);display:block;margin:0 auto 10px;box-shadow:0 3px 12px rgba(0,0,0,.14)}
.ava-s{width:34px;height:34px;border-radius:50%;border:1.5px solid #A8853C;vertical-align:middle;margin-right:6px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.chip{padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font-size:.85rem;cursor:pointer}
.chip.on{border-color:var(--gold-l);background:rgba(201,169,97,.18);font-weight:700;color:#EAD9A6}
.deep{margin-top:14px}
.deep .notice{display:block;margin-bottom:10px}
.ai-tag{display:inline-block;font-size:.68rem;color:#F5F2E8;background:#A8853C;border-radius:8px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.flip{perspective:700px}
.finner{position:relative;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.7,.3,1)}
.flip.on .finner{transform:rotateY(180deg)}
.fback,.ffront{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ffront{position:absolute;inset:0;transform:rotateY(180deg)}
.fback svg,.ffront svg{display:block;width:100%;height:auto}
.flat .finner{transform:none!important;transition:none}
.flat .fback{display:none}
.flat .ffront{position:static;transform:none}
#interpBox{margin-top:4px}
#interpBox .loading{padding:18px 8px}
.actions{flex-wrap:wrap}
.actions .btn{flex:1 1 46%;min-width:150px}
.actions .btn.full{flex:1 1 100%}
.modal{position:fixed;inset:0;background:rgba(6,9,20,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:60;padding:16px;gap:12px}
.modal img{max-width:min(92vw,420px);max-height:64vh;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.modal .mhint{color:#EAE4D6;font-size:.85rem;text-align:center;line-height:1.6}
.modal .mrow{display:flex;gap:10px;width:min(92vw,420px)}
.modal .mrow .btn{margin-top:0;flex:1}
.modal .btn.ghost{background:#141B33}
.hide{display:none}
@page{size:A4 portrait;margin:12mm}
@media print{
 .ava-s{width:11mm;height:11mm}
 .fback{display:none}
 .ffront{position:static;transform:none}
 .finner{transform:none!important}
 .modal{display:none!important}
 .sheet{box-shadow:none}
 body{background:#fff}
 .app>*:not(#stepResult){display:none!important}
 #stepResult .actions,#stepResult .notice,#printHint,.deep{display:none!important}
 .sheet{margin-bottom:0}
 .app{max-width:none;padding:0}
 .sheet{border:none;border-radius:0;padding:0;margin:0;width:100%}
 *{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .crow,.rwrap,.rd,.syn{break-inside:avoid}
 .rwrap{flex-wrap:nowrap;gap:3mm;margin-bottom:3mm}
 .rd{min-width:0;padding:2.5mm 3mm}
 .sheet header{padding-bottom:2.5mm;margin-bottom:3mm}
 .sheet h2{font-size:15pt}
 .sheet .q{font-size:10pt}
 .sheet .q b{font-size:8pt}
 .crow{gap:5mm;margin-bottom:2mm}
 .cslot{width:34mm;max-width:34mm}
 .pos{font-size:8.5pt;margin-bottom:1mm}
 .cname{font-size:9.5pt;margin-top:1.2mm}
 .cdir{font-size:8pt}
 .inote{font-size:8pt;margin:2mm 0 3mm}
 .rd h3{font-size:10.5pt;margin-bottom:1.5mm}
 .rd h4{font-size:9pt;margin:1.6mm 0 .5mm}
 .rd p{font-size:9pt;line-height:1.42}
 .basis{font-size:8pt}
 .syn{padding:2.8mm 3.5mm}
 .syn h3{font-size:10.5pt;margin-bottom:1.5mm}
 .syn h4{font-size:9pt;margin:1.4mm 0 .4mm}
 .syn p,.syn li{font-size:9pt;line-height:1.42}
 .syn ol{padding-left:5mm}
 .sfoot{font-size:8pt;margin-top:2mm}
}
</style>
</head>

<h1>로로의 타로 테이블</h1>
<div class="tag" id="quota" style="margin-top:6px"></div>
</div>

<!-- 1: 고민 입력 -->
<section id="stepAsk" class="panel">
<p class="lead">공쥬 어서 와요, 기다리고 있었어요.<br>고민이 무엇인지 알려주세요.</p>
<textarea id="concern" maxlength="200" placeholder="예: 준비 중인 일, 지금 시작해도 될까요?"></textarea>
<div class="cats" id="cats">
<button class="chip" data-cat="work">일·진로</button>
<button class="chip" data-cat="rel">관계</button>
<button class="chip" data-cat="new">새로운 도전</button>
<button class="chip" data-cat="money">돈·현실</button>
<button class="chip" data-cat="mind">마음·회복</button>
</div>
<div class="hint" id="catHint">고민이 속한 영역도 하나 콕 짚어줘요. 읽는 결이 달라지거든요.<br>고민은 해석을 만드는 데만 쓰이고, 어디에도 저장되지 않아요.</div>
<button class="btn" id="btnShuffle">언니, 카드 빨리 섞어줘</button>
</section>

<!-- 2: 숫자 선택 -->
<section id="stepPick" class="panel hide">
<p class="lead">78장, 방금 다 섞었어요.<br>마음이 끌리는 숫자 <b>3개</b>만 순서대로 골라봐요.</p>
<div class="pick-legend">고른 순서대로 ① 현재 상황 → ② 살펴볼 점 → ③ 행동 조언 으로 읽어줄게요</div>
<div class="grid" id="numGrid"></div>
<button class="btn" id="btnReveal" disabled>이 세 장으로 할래요</button>
</section>

<!-- 3: 로딩 -->
<section id="stepLoad" class="panel hide">
<div class="loading"><div class="orb"></div><div class="load-msg" id="loadMsg">카드를 펼치는 중…</div></div>
</section>

<!-- 4: 결과 -->
<section id="stepResult" class="hide">
<div class="sheet" id="sheet"></div>
<div class="actions">
<button class="btn ghost" id="btnSaveImg">결과지 이미지로 저장</button>
<button class="btn full" id="btnAgain">다른 고민도 봐줘요</button>
</div>
<div class="modal hide" id="imgModal">
<img id="storyImg" alt="리딩 결과지">

</div>
</section>

function show(step){for(const s of["stepAsk","stepPick","stepLoad","stepResult"])$(s).classList.toggle("hide",s!==step);}
function cryptoInt(n){const max=Math.floor(0x100000000/n)*n,b=new Uint32Array(1);let v;do{crypto.getRandomValues(b);v=b[0];}while(v>=max);return v%n;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=cryptoInt(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

[...document.querySelectorAll("#cats .chip")].forEach(ch=>{
  ch.onclick=()=>{cat=ch.dataset.cat;
    [...document.querySelectorAll("#cats .chip")].forEach(c=>c.classList.toggle("on",c===ch));};
});

const DAILY_MAX=3;
function todayKey(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function getQuota(){try{const r=JSON.parse(localStorage.getItem("lolo_q")||"{}");return r.d===todayKey()?r.n||0:0;}catch(e){return 0;}}
function useQuota(){try{localStorage.setItem("lolo_q",JSON.stringify({d:todayKey(),n:getQuota()+1}));}catch(e){}updateQuotaUI();}
function quotaLeft(){return Math.max(0,DAILY_MAX-getQuota());}
function updateQuotaUI(){const el=$("quota");if(!el)return;const n=quotaLeft();
  el.innerHTML=n>0?("오늘 남은 질문 "+"🌙".repeat(n)+'<span style="opacity:.35">'+"🌙".repeat(DAILY_MAX-n)+"</span>")
                 :"오늘의 질문 세 번을 다 썼어요 · 내일 다시 만나요 🌙";}
updateQuotaUI();
$("btnShuffle").onclick=()=>{
  if(quotaLeft()<=0){$("catHint").textContent="오늘의 질문 세 번을 다 썼어요. 카드는 내일 또 열려요 🌙";return;}
  if(!$("concern").value.trim()){$("concern").focus();return;}
  if(!cat){$("catHint").textContent="⚠ 고민 영역을 하나 골라주세요!";return;}
  order=shuffle([...DECK.keys()]);
  picks=[];
  const g=$("numGrid");g.innerHTML="";
  for(let n=1;n<=78;n++){
    const b=document.createElement("button");
    b.className="num";b.textContent=n;
    b.onclick=()=>{
      const i=picks.indexOf(n);
      if(i>-1){picks.splice(i,1);}else{if(picks.length>=3)return;picks.push(n);}
      [...g.children].forEach(c=>{
        const k=picks.indexOf(+c.textContent);
        c.classList.toggle("sel",k>-1);
        if(k>-1)c.dataset.ord=k+1;
      });
      $("btnReveal").disabled=picks.length!==3;
    };
    g.appendChild(b);
  }
  $("btnReveal").disabled=true;
  show("stepPick");window.scrollTo({top:0});
};

function fillInterp(data,cards){
  const mid='<div class="rwrap">'+readerHTML("직설적으로 이렇게 해석할게요.","a",data.a,cards)
    +readerHTML("교과서적으로 이렇게 해석할게요.","b",data.bR,cards)+'</div>';
  const syn='<div class="syn"><h3>로로의 종합 한마디</h3><h4>공통 메시지</h4><p>'+esc(data.common)+'</p><h4>해석의 차이</h4><p>'+esc(data.diff)
    +'</p><h4>지금 실천할 행동 3가지</h4><ol>'+data.acts.map(a=>'<li>'+esc(a)+'</li>').join("")+'</ol></div>';
  if(data.q)$("qtxt").textContent=data.q.slice(0,60);
  $("interpBox").innerHTML=mid+syn;
  $("btnSaveImg").disabled=false;
}
function buildPrompt(q,cards){
  const names=cards.map((c,i)=>POS[i]+": "+c.ko).join(" / ");
  return ["당신은 '로로'라는 타로 리더입니다. 아래 고민과 이미 무작위로 뽑힌 카드 3장(모두 정방향, 라이더-웨이트-스미스)을 해석하세요. 타로는 오락용 상징 해석입니다.",
"말투: 다정하고 야무진 언니가 마주 앉아 말해주듯 따뜻한 해요체. 유행어·과한 이모지 금지, 품위 있게. 겁주지 않되 필요한 말은 돌리지 말고 분명하게. 출력 전 모든 문장의 맞춤법과 오탈자를 스스로 검수해 정확한 한국어로만 쓸 것.",
"고민("+CATS[cat].l+" 영역): "+q,
"뽑힌 카드: "+names,
"구성: 같은 카드 3장을 로로가 두 갈래로 읽습니다. [직설 해석]은 놓치기 쉬운 문제와 현실적 선택을 직설적으로(겁주기·비난 금지). [교과서 해석]은 전통적 의미·배치 위치·세 카드의 연결 중심으로, 해석이 갈리면 조건을 설명. 억지 반대 의견을 만들지 말고 실제로 다른 부분만 구분. 본문에서는 두 갈래를 '직설 해석'·'교과서 해석'이라고만 부르고, a·bR 같은 데이터 키 이름은 절대 언급 금지.",
"원칙: 사용자가 말하지 않은 과거·속마음·타인의 의도를 사실처럼 만들지 말 것. 확률·날짜·합격·수익 보장 등 근거 없는 예측 금지. 건강·수명·임신·죽음 예언 금지, 의료·법률·투자 판단 대행 금지. 카드를 이유로 퇴사·관계 단절·큰 지출 단정 권유 금지. 죽음·탑·악마류 카드는 재난이 아닌 변화·구조의 흔들림·집착의 상징으로. 모든 카드를 무조건 좋게 비틀지 말 것. 범용 위로 대신 카드 상징과 이 고민 문장을 직접 연결한 구체적 문장.",
"분량: 각 항목 t는 한글 최대 2문장(항목당 100자 이내), b는 '카드명 · 상징 요약' 형식 20자 이내. common/diff 각 120자 이내, acts는 이 고민에 맞는 작고 구체적인 행동 3개(각 40자 이내). q는 고민을 60자 이내로 요약.",
'JSON만 출력: {"q":"...","a":[{"t":"...","b":"..."},{"t":"...","b":"..."},{"t":"...","b":"..."}],"bR":[동일 형식 3개],"common":"...","diff":"...","acts":["...","...","..."]}',
"JSON에서 a에는 직설 해석 3항목, bR에는 교과서 해석 3항목을 담고, 두 배열의 순서는 [현재 상황, 살펴볼 점, 행동 조언]입니다."].join(String.fromCharCode(10));
}

const ERRCOPY={rate_limited:"내 계정 사용량이 잠깐 찼어요. 조금 쉬었다가 '다시 시도' 눌러줘요.",refused:"이 문장으로는 해석을 만들 수 없었어요. 표현을 조금 바꿔서 새로 뽑아봐요.",invalid_json:"해석이 살짝 엉켰어요. '다시 시도' 한 번만 눌러줘요.",upstream_error:"연결이 잠깐 흔들렸어요. '다시 시도' 눌러줘요.",empty_completion:"해석이 비어서 왔어요. '다시 시도' 눌러줘요."};
const HIDECODES=["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];
const LOADS=["카드 펼치는 중…","로로가 어떻게 해석할지 고민 중…","프린트가 고장나서 로로가 열심히 손으로 적는 중.."];
let loadTimer=null;
function startLoad(){let i=0;$("loadMsg").textContent=LOADS[1];clearInterval(loadTimer);loadTimer=setInterval(()=>{i=Math.min(i+1,LOADS.length-1);$("loadMsg").textContent=LOADS[i];},4500);}
function stopLoad(){clearInterval(loadTimer);}

function interpError(msg,retryable){
  stopLoad();
  $("interpBox").innerHTML='<div class="notice" style="display:block">'+esc(msg)
    +(retryable?'<br><br><button class="btn" id="btnRetry" style="margin-top:6px">다시 시도</button>':'')+'</div>';
  if(retryable)$("btnRetry").onclick=()=>{
    $("interpBox").innerHTML='<div class="loading"><div class="orb"></div><div class="load-msg" id="loadMsg"></div></div>';
    startLoad();interpret();};
}

async function interpret(){
  try{
    const res=await fetch("/api/reading",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({q:lastCtx.q,cat:cat,cards:lastCtx.cards.map(c=>c.en)})});
    if(res.status===429)throw{code:"rate_limited"};
    if(!res.ok)throw{code:"upstream_error"};
    const data=await res.json();
    if(!data||!Array.isArray(data.a)||data.a.length!==3||!Array.isArray(data.bR)||data.bR.length!==3||!Array.isArray(data.acts))throw{code:"invalid_json"};
    stopLoad();fillInterp(data,lastCtx.cards);
    useQuota();
  }catch(e){
    interpError(ERRCOPY[e.code]||ERRCOPY.upstream_error,true);
  }
}

function beginReading(){
  renderSkeleton(lastCtx.q,lastCtx.cards);
  show("stepResult");window.scrollTo({top:0});
  startFlips();startLoad();interpret();
}
$("btnReveal").onclick=()=>{
  lastCtx={q:$("concern").value.trim(),cards:picks.map(n=>DECK[order[n-1]])};
  beginReading();
};
/* ── 결과지 이미지 저장 ── */
let storyBlob=null;
async function makeStoryImage(){
  const sheet=$("sheet");
  sheet.classList.add("flat");
  const cap=await html2canvas(sheet,{scale:2,backgroundColor:"#FAF6EC",logging:false});
  sheet.classList.remove("flat");
  const W=1080,H=1920,c=document.createElement("canvas");c.width=W;c.height=H;
  const g=c.getContext("2d");
  const grad=g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#1A2348");grad.addColorStop(.6,"#0F152A");grad.addColorStop(1,"#0B1020");
  g.fillStyle=grad;g.fillRect(0,0,W,H);
  g.fillStyle="#EAD9A6";
  const stars=[[90,140,3],[980,120,2.5],[160,1760,2.5],[930,1800,3],[540,70,2],[70,960,2],[1010,1000,2.2],[240,90,1.8],[860,1860,1.8]];
  for(const [x,y,r] of stars){g.beginPath();g.arc(x,y,r,0,7);g.fill();}
  const pad=70, maxW=W-pad*2, maxH=H-pad*2;
  const sc=Math.min(maxW/cap.width, maxH/cap.height);
  const dw=cap.width*sc, dh=cap.height*sc;
  g.save();g.shadowColor="rgba(0,0,0,.55)";g.shadowBlur=48;g.shadowOffsetY=16;
  g.drawImage(cap,(W-dw)/2,(H-dh)/2,dw,dh);g.restore();
  return new Promise(res=>c.toBlob(res,"image/png"));
}
$("btnSaveImg").onclick=async()=>{
  const b=$("btnSaveImg");
  if(b.disabled)return;
  b.disabled=true;const t=b.textContent;b.textContent="결과지 만드는 중…";
  try{
    storyBlob=await makeStoryImage();
    $("storyImg").src=URL.createObjectURL(storyBlob);
    $("btnDl").classList.remove("hide");
    $("mhint").textContent="아래 버튼으로 저장하거나, 이미지를 꾹 눌러 저장해줘요.";
    $("imgModal").classList.remove("hide");
  }catch(e){alert("결과지를 만들다 살짝 넘어졌어요. 한 번만 다시 눌러줘요.");}
  b.disabled=false;b.textContent=t;
};
$("btnDl").onclick=()=>{
  if(!storyBlob)return;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(storyBlob);a.download="lolo-tarot.png";
  document.body.appendChild(a);a.click();a.remove();
  $("mhint").textContent="저장했어요! 스토리에 자랑해줘요 ✨";
};
$("btnCloseM").onclick=()=>{$("imgModal").classList.add("hide");};
$("btnAgain").onclick=()=>{order=null;picks=[];cat=null;[...document.querySelectorAll("#cats .chip")].forEach(c=>c.classList.remove("on"));$("concern").value="";show("stepAsk");window.scrollTo({top:0});};
</script>
