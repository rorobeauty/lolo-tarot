<style>
:root{--ink:#EAE4D6;--gold:#A8853C;--gold-l:#C9A961;--card:#1A2140;--line:#39456E;--muted:#9AA3C6;--app-bg:#0F152A;
--s-bg:#FBF6EA;--s-ink:#2B2A26;--burg:#7C2D3E;--s-line:#D8CDB4}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(120% 90% at 50% 0%,#1A2348 0%,var(--app-bg) 58%,#0B1020 100%);min-height:100vh;color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.app{max-width:680px;margin:0 auto;padding:26px 14px 60px}
h1{font-family:"Apple Myungjo","Nanum Myeongjo",Batang,serif;color:#EAD9A6;font-size:1.4rem;text-align:center;letter-spacing:1px}
.tag{text-align:center;color:var(--gold-l);font-size:.82rem;margin:6px 0 2px}
.hero{position:relative;background:linear-gradient(175deg,#131A32 0%,#1E2A4A 70%,#26325A 100%);border-radius:18px;padding:26px 14px 20px;margin-bottom:16px;overflow:hidden;text-align:center}
.hero .sky{position:absolute;inset:0;pointer-events:none}
.ava{width:88px;height:88px;border-radius:50%;border:2.5px solid var(--gold);display:block;margin:0 auto 10px;box-shadow:0 0 22px rgba(201,169,97,.45)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.panel p.lead{font-size:.94rem;line-height:1.7;margin-bottom:12px}
label{display:block;font-size:.78rem;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=date],input[type=time],textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;font-size:.95rem;background:transparent;color:var(--ink);color-scheme:dark}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--gold-l)}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chip{padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font-size:.85rem;cursor:pointer}
.chip.on{border-color:var(--gold-l);background:rgba(201,169,97,.18);font-weight:700;color:#EAD9A6}
#focus{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#focus .chip{padding:9px 4px;text-align:center;white-space:nowrap}
@media (max-width:380px){#focus{grid-template-columns:repeat(3,1fr)}}
.leap{display:none;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin-top:6px}
.leap.show{display:flex}
.btn{display:block;width:100%;padding:15px;margin-top:14px;font-size:1rem;font-weight:700;color:#141B33;background:linear-gradient(135deg,#E3C77E,#B8934A);border:none;border-radius:11px;cursor:pointer;letter-spacing:1px;box-shadow:0 2px 14px rgba(201,169,97,.28)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--gold-l);border:1.5px solid var(--gold-l);box-shadow:none}
.hint{font-size:.8rem;color:var(--muted);margin-top:8px;line-height:1.6}
.err{color:#E0A8A0;font-size:.85rem;margin-top:8px;line-height:1.5;display:none}
.loading{text-align:center;padding:26px 10px}
.orb{width:48px;height:48px;margin:0 auto 14px;border-radius:50%;border:3px solid var(--gold-l);border-top-color:transparent;animation:spin 1.1s linear infinite;box-shadow:0 0 26px rgba(201,169,97,.5),inset 0 0 14px rgba(201,169,97,.3)}
@keyframes spin{to{transform:rotate(360deg)}}
.load-msg{font-size:.9rem;color:var(--muted)}
/* ── 결과지: 아이보리·먹·버건디·금 ── */
.sheet{background:var(--s-bg);color:var(--s-ink);border:1px solid var(--s-line);border-radius:14px;padding:22px 18px;margin-bottom:14px;box-shadow:0 10px 34px rgba(0,0,0,.5)}
.sheet header{text-align:center;border-bottom:2.5px solid var(--burg);padding-bottom:12px;margin-bottom:12px}
.sheet h2{font-family:"Apple Myungjo","Nanum Myeongjo",Batang,serif;font-size:1.2rem;color:var(--burg);letter-spacing:2px}
.sheet .who{font-size:.78rem;color:#6d6555;margin-top:5px}
.ms{display:flex;gap:8px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}
.pil{min-width:64px;background:#fff;border:1.5px solid var(--gold);border-radius:9px;padding:7px 6px;text-align:center}
.pil .pl{font-size:.62rem;color:#8A8272;letter-spacing:1px}
.pil .pv{font-family:"Apple Myungjo",Batang,serif;font-size:1.02rem;font-weight:700;color:var(--burg);margin-top:2px}
.pil .pe{font-size:.62rem;color:var(--gold);margin-top:2px}
.qline{font-size:.8rem;text-align:center;margin:10px 0 2px;color:#57503f}
.qline b{color:var(--burg);border:1px solid var(--gold);border-radius:99px;padding:1px 9px;margin-right:6px;font-size:.72rem}
.rwrap{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:14px 0}
/* ── 2027 사자성어 ── */
.idiom27{text-align:center;margin:12px 0 2px;padding:12px 12px 11px;border:1px solid var(--gold);border-radius:10px;background:#fff}
.idiom27 .il{font-size:.66rem;letter-spacing:1.5px;color:var(--gold)}
.idiom27 .iw{margin-top:3px;font-family:"Apple Myungjo","Nanum Myeongjo",Batang,serif;font-weight:700;color:var(--burg)}
.idiom27 .iw b{font-size:1.5rem;letter-spacing:4px}
.idiom27 .iw span{font-size:.95rem;letter-spacing:3px;color:var(--gold);margin-left:8px;font-weight:400}
.idiom27 .im{font-size:.84rem;margin-top:4px;color:var(--s-ink)}
.idiom27 .ib{font-size:.66rem;color:#8A8272;margin-top:5px;line-height:1.5}
.rd{border-radius:10px;padding:13px 12px;background:#fff}
.rd.a{border-top:4px solid var(--burg)}
.rd.b{border-top:4px solid var(--gold)}
.rd h3{font-family:"Apple Myungjo",Batang,serif;font-size:.9rem;margin-bottom:9px;color:var(--burg)}
.rd.b h3{color:var(--gold)}
.rd h4{font-size:.74rem;margin:9px 0 3px;color:#57503f}
.rd p{font-size:.76rem;line-height:1.58}
.basis{display:block;font-size:.64rem;color:#8A8272;margin-top:2px}
.syn{background:#F3EDE0;border-radius:10px;padding:14px 13px;margin-top:2px;border-top:4px solid var(--burg)}
.syn h3{font-family:"Apple Myungjo",Batang,serif;font-size:.92rem;color:var(--burg);margin-bottom:8px}
.syn h4{font-size:.76rem;color:#57503f;margin:9px 0 3px}
.syn p,.syn li{font-size:.78rem;line-height:1.6}
.syn ol{padding-left:18px}
.sfoot{text-align:center;font-size:.66rem;color:#8A8272;margin-top:12px;line-height:1.6}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 46%;min-width:150px;margin-top:0}
.actions .btn.full{flex:1 1 100%}
.modal{position:fixed;inset:0;background:rgba(6,9,20,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:60;padding:16px;gap:12px}
.modal img{max-width:min(92vw,420px);max-height:64vh;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.modal .mhint{color:#EAE4D6;font-size:.85rem;text-align:center;line-height:1.6}
.modal .mrow{display:flex;gap:10px;width:min(92vw,420px)}
.modal .mrow .btn{margin-top:0;flex:1}
.modal .btn.ghost{background:#141B33}
.hide{display:none}
@media (max-width:520px){.rwrap{grid-template-columns:1fr}}
@media print{
 @page{size:A4 portrait;margin:10mm}
 body{background:#fff!important}
 .hero,.actions,.modal,#stepAsk,#stepLoad{display:none!important}
 .app{max-width:none;padding:0}
 .sheet{box-shadow:none;border:none;border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .rwrap{grid-template-columns:1fr 1fr}
}
body{word-break:keep-all;overflow-wrap:break-word}/* ── 휴업 안내 ── */
.closed{text-align:center;padding:30px 16px 28px}
.closed .moon{font-size:2.3rem;line-height:1;margin-bottom:14px;filter:drop-shadow(0 0 16px rgba(201,169,97,.5))}
.closed h2{font-family:"Apple Myungjo","Nanum Myeongjo",Batang,serif;color:#EAD9A6;font-size:1.12rem;line-height:1.75;letter-spacing:.5px;font-weight:700;word-break:keep-all}
.closed p{color:var(--muted);font-size:.88rem;line-height:1.7;margin-top:12px;word-break:keep-all}
.closed .sig{margin-top:18px;font-size:.74rem;color:var(--gold-l);letter-spacing:1px;opacity:.8}
/* ── 다른 테이블로 가는 하단 링크 ── */
.xnav{margin-top:18px;text-align:center}
.xnav a.go{display:block;padding:14px;border:1.5px solid var(--gold-l);border-radius:11px;color:#EAD9A6;text-decoration:none;font-weight:700;letter-spacing:.5px;background:rgba(201,169,97,.08)}
.xnav .sub{margin-top:10px;font-size:.8rem;color:var(--muted)}
.xnav .sub a{color:var(--gold-l);text-decoration:none;margin:0 6px}
/* ── 자시(23:30 이후) 출생 날짜 기준 ── */
.jasi{margin-top:8px;border:1px dashed var(--gold-l);border-radius:10px;padding:10px 12px}
.jasi .jt{font-size:.8rem;color:#EAD9A6;margin-bottom:6px}
.jasi .jh{font-size:.72rem;color:var(--muted);margin-top:6px;line-height:1.5}
.jasi .cats{margin-top:0}
</style>
</head>

<h1>두 명의 명리학자가 바라본 나</h1>
<div class="tag" id="quota"></div>
</div>

<!-- 0: 휴업 안내 (맨 위 휴업문구가 비어 있지 않으면 이 패널만 보여요) -->
<section id="stepClosed" class="panel closed hide">
<div class="moon">🌙</div>
<h2 id="closedMsg"></h2>
<p id="closedSub"></p>
<div class="sig">— 살림안하는 로로 🥷</div>
</section>

<!-- 1: 입력 -->
<section id="stepAsk" class="panel">
<p class="lead">공쥬의 사주 명식을 두 명리학자가 각자의 눈으로 읽어드려요.<br>직설파와 정통파, 서로 다른 두 해석을 한 장에 담아줄게요.</p>

<label>이름 (결과지에 표시돼요 · 선택)</label>
<input type="text" id="n1" maxlength="10" placeholder="예: 로로">

<label>생년월일 (필수)</label>
<div class="cats" id="cals">
<button class="chip on" data-cal="solar">양력</button>
<button class="chip" data-cal="lunar">음력</button>
</div>
<div class="leap" id="leapRow"><input type="checkbox" id="leap" style="width:auto"><label for="leap" style="margin:0;display:inline">윤달이에요</label></div>
<input type="date" id="d1" min="1930-01-01" style="margin-top:8px">

<label>태어난 시간 (선택 · 모르면 비워둬요)</label>
<input type="time" id="t1">
<div class="jasi hide" id="jasiRow1">
<div class="jt">밤 11시 30분 이후는 사주에서 '자시'라 날짜 기준을 골라야 해요.</div>
<div class="cats" id="jasi1"><button class="chip on" data-jasi="jeong">다음 날로 (정자시)</button><button class="chip" data-jasi="ya">당일로 (야자시)</button></div>
<div class="jh">만세력 앱 대부분은 정자시(다음 날)예요. 다른 곳에서 본 일주와 맞추고 싶으면 그쪽 기준으로 골라요.</div>
</div>

<label>성별</label>
<div class="cats" id="sexes">
<button class="chip on" data-sex="f">여성</button>
<button class="chip" data-sex="m">남성</button>
</div>


<label>어떤 이야기를 듣고 싶어요?</label>
<div class="cats" id="focus">
<button class="chip on" data-focus="all">종합</button>
<button class="chip" data-focus="love">연애</button>
<button class="chip" data-focus="work">일·공부</button>
<button class="chip" data-focus="money">돈</button>
<button class="chip" data-focus="people">사람</button>
</div>

<label>지금의 고민 (필수)</label>
<textarea id="q" maxlength="200" placeholder="예: 지금 하는 일을 계속 밀고 가도 될까요?"></textarea>

<button class="btn" id="btnGo">두 분께 여쭤볼게요</button>
<div class="err" id="formErr"></div>
<div class="hint">입력한 정보는 명식을 읽는 데만 쓰이고, 어디에도 저장되지 않아요.</div>
</section>

<!-- 2: 로딩 -->
<section id="stepLoad" class="panel hide">
<div class="loading"><div class="orb"></div><div class="load-msg">두 명리학자가 명식을 펼쳐 보고 있어요.</div></div>
</section>

<!-- 3: 결과 -->

<div class="actions">

해보는 시간을 따로 정해 보세요.","work":"내 기운이 센 편으로 분류된 데에 배움과 지원의 주제가 더해져요. 자료를 더 모으는 일만 반복하기보다 이미 배운 방법 하나를 실제로 써 보는 쪽에 힘을 실어 보세요."},"약":{"push":"막히는 절차 하나의 예시나 안내 자료를 담당자에게 요청해 보세요.","work":"내 기운이 약한 편으로 분류됐다면 배움과 지원을 기본기를 보태는 방법으로 읽어요. 혼자 오래 막혀 있기보다 예시 자료나 구체적인 도움부터 확보해 보세요."}},"재성":{"강":{"push":"여럿에게 한 약속의 마감일을 한곳에 모아, 겹치는 일정을 정리해 보세요.","work":"내 기운이 센 편으로 분류됐다면 들어온 기회를 실행으로 옮기는 주제를 살펴요. 시작한 일의 중간 점검일과 끝낼 기준을 미리 정해, 여러 기회 사이에서 빠뜨리는 부분을 줄여 보세요."},"약":{"push":"큰 제안을 바로 받기보다 기간이나 규모를 줄여 시험할 수 있는지 물어보세요.","work":"내 기운이 약한 편으로 분류됐다면 기회나 일감이 늘 때 따라오는 부담도 함께 살펴요. 제안의 규모를 줄이고 이미 맡은 일과 예산을 먼저 지키는 기준을 세워 보세요."}}},"themes":{"겁재":{"action":"다음 공동 지출이나 모임 하나의 비용 분담 방식을 참여자에게 메시지로 확인해 보세요.","headline":"경쟁의 속도보다 내 몫과 협력의 기준부터","lead":"겁재는 전통적으로 경쟁하는 상대와 함께하는 동료를 뜻하며, 역할과 몫을 어떻게 나눌지 살피는 주제로 읽어요.","money":"함께 내는 돈은 금액뿐 아니라 남은 돈을 어떻게 돌려줄지도 정해 두세요. 경쟁하듯 소비하게 되는 자리에서는 내가 쓸 한도를 먼저 정해 보세요.","people":"상대의 성과를 내 가치와 바로 비교하지 않아도 괜찮아요. 서운한 몫이 있다면 누가 더 애썼는지 따지기보다 다음에 어떻게 나눌지 이야기해 보세요.","push":"서로 다른 장점을 가진 사람과 역할을 나눠 보세요.","reduce":"뒤처지기 싫어서 원하지 않는 약속까지 잡는 일을 줄여 보세요.","work":"비슷한 목표를 가진 사람의 방법에서 배울 점을 찾아보세요. 팀을 고를 때는 친분만 보기보다 역할과 결과를 나누는 기준이 분명한지 확인해 보세요."},"비견":{"action":"이번 주 함께할 일 하나를 골라 내가 정할 부분과 같이 정할 부분을 종이에 나눠 적어 보세요.","headline":"내 기준은 또렷하게, 함께할 일은 유연하게","lead":"비견은 전통적으로 나와 비슷한 힘을 뜻하며, 내 기준을 세우고 스스로 선택하는 주제로 읽어요.","money":"내가 중요하게 여기는 지출과 남을 따라 하는 지출을 나눠 보세요. 같이 돈을 쓰는 일은 각자 낼 금액을 먼저 정하는 편이 좋아요.","people":"내가 원하는 것을 말하되 상대도 다르게 고를 수 있다는 여지를 남겨 주세요. 가까운 사이라도 혼자 보내는 시간과 함께할 시간을 구분해 보세요.","push":"내가 끝까지 맡을 수 있는 일 하나를 직접 결정해 보세요.","reduce":"다른 방식이라는 이유만으로 상대의 제안을 밀어내는 말을 줄여 보세요.","work":"혼자 책임질 수 있는 일을 정하면 내 방식의 장점을 살리기 좋아요. 함께하는 과제에서는 방법을 모두 통일하기보다 마감과 완성 기준부터 맞춰 보세요."},"상관":{"action":"바꾸고 싶은 방식 하나를 골라 문제점과 대안을 각각 한 문장으로 써 보세요.","headline":"새로운 생각은 선명하게, 전달 방식은 차분하게","lead":"상관은 전통적으로 생각을 밖으로 표현하고 익숙한 방식을 바꾸되, 규칙과 어떻게 조율할지 살피는 주제로 읽어요.","money":"직접 만든 것에 돈을 쓰기 전에는 꼭 필요한 비용과 꾸미기 위한 비용을 나눠 보세요. 눈에 띄는 홍보 문구보다 실제 제공 내용과 추가 비용을 확인해 보세요.","people":"솔직한 말도 상대가 받아들일 수 있는 때와 표현을 고르면 더 잘 전달돼요. 사람 전체를 평가하기보다 내가 불편했던 말이나 행동 하나를 짚어 주세요.","push":"다른 사람이 이해할 수 있는 예시를 붙여 내 생각을 제안해 보세요.","reduce":"사람들 앞에서 바로 반박하거나 빈정대는 말을 줄여 보세요.","work":"불편한 점을 찾았다면 비판만 하기보다 바꿀 방법 하나를 붙여 보세요. 새 방식을 제안할 때는 바꿔도 되는 범위와 반드시 지켜야 할 기준을 먼저 확인해 보세요."},"식신":{"action":"손에 있는 도구만 써서 20분 안에 끝낼 수 있는 결과물 하나를 만들어 보세요.","headline":"잘하는 일을 작게 쌓아 눈에 보이는 결과로","lead":"식신은 전통적으로 재능을 꾸준히 써서 무언가를 만들고 일상을 돌보는 주제로 읽어요.","money":"자주 쓰는 물건은 가격만 보지 말고 실제 사용 횟수와 관리 비용을 함께 살펴보세요. 잘할 수 있는 일에 돈을 쓰더라도 지금 필요한 도구부터 골라 보세요.","people":"거창한 표현보다 상대가 부탁한 작은 일을 지키는 방식으로 마음을 전해 보세요. 다만 챙겨 주는 일이 내 몫으로 굳어지지 않도록 원하는 도움도 말해 주세요.","push":"이미 할 줄 아는 일을 완성품 하나로 남겨 보세요.","reduce":"도구를 더 사야 시작할 수 있다는 생각을 줄여 보세요.","work":"한 번에 크게 해내기보다 매번 남길 결과물의 크기를 정해 보세요. 공부라면 문제 몇 개, 일이라면 초안 한 쪽처럼 반복할 수 있는 단위가 좋아요."},"정관":{"action":"가장 가까운 제출이나 신청 하나의 마감일, 필수 자료, 제출 방법을 한곳에 적어 보세요.","headline":"맡은 일을 분명히 할수록 신뢰도 차곡차곡","lead":"정관은 전통적으로 책임과 약속, 자격과 절차를 통해 신뢰를 쌓는 주제로 읽어요.","money":"지급일과 납부일을 달력에 표시해 빠뜨리는 비용을 줄여 보세요. 신청이나 구매에 조건이 붙어 있다면 금액뿐 아니라 내가 충족해야 할 항목도 확인해 보세요.","people":"관계에서 중요하게 여기는 약속을 상대가 알아서 알 것이라 넘기지 말고 말해 주세요. 예의를 지키는 것과 늘 상대의 기대에 맞추는 것은 달라도 괜찮아요.","push":"다른 사람이 확인할 수 있는 완료 기준을 세워 보세요.","reduce":"책임감 때문에 내 역할 밖의 부탁까지 모두 떠안는 일을 줄여 보세요.","work":"과제나 업무를 시작할 때 제출 조건과 평가 기준을 먼저 읽어 보세요. 책임을 맡는다면 결정할 수 있는 범위와 도움받을 곳도 함께 확인하는 편이 좋아요."},"정인":{"action":"오늘 배운 내용 하나를 자료를 덮고 세 문장으로 설명한 뒤, 틀린 부분만 다시 확인해 보세요.","headline":"배운 것을 내 말로 정리하며 기본기를 단단히","lead":"정인은 전통적으로 배움과 도움을 받아 기본기를 익히고 나를 뒷받침할 바탕을 만드는 주제로 읽어요.","money":"강의나 책을 고를 때는 유명한지보다 지금의 질문을 해결하는지 확인해 보세요. 이미 가진 자료에서 필요한 내용을 찾을 수 있는지도 먼저 살펴보세요.","people":"도움을 받았다면 무엇이 도움이 됐는지 구체적으로 전해 보세요. 조언을 존중하되 마지막 선택까지 상대에게 맡기지는 않아도 괜찮아요.","push":"반복해서 막히는 기초 개념 하나를 제대로 이해해 보세요.","reduce":"누군가의 허락이나 확신이 생길 때까지 선택을 미루는 일을 줄여 보세요.","work":"막히는 내용이 있다면 자료를 더 모으기 전에 어디부터 이해되지 않는지 짚어 보세요. 배운 내용을 내 말로 설명할 수 있는지 확인하면 다음에 공부할 부분이 보여요."},"정재":{"action":"최근 결제 내역에서 정기 결제 하나를 골라 다음 결제일과 실제 사용 여부를 확인해 보세요.","headline":"꾸준히 지킬 수 있는 예산이 선택을 편하게","lead":"정재는 전통적으로 반복해서 들어오고 나가는 돈과 자원을 성실하게 관리하는 주제로 읽어요.","money":"정기적으로 들어오는 돈 안에서 꼭 나갈 돈을 먼저 빼고 쓸 금액을 정해 보세요. 할인 폭이 커도 원래 살 계획이 없었다면 구매를 미뤄도 괜찮아요.","people":"관계를 위해 쓰는 돈과 시간을 내가 감당할 수 있는 범위에서 정해 보세요. 성의의 크기를 가격으로 재기보다 서로 편한 만남 방식을 찾아보세요.","push":"지금 생활에 맞는 현실적인 주간 예산을 지켜 보세요.","reduce":"작은 금액이라 확인하지 않고 계속 결제하는 일을 줄여 보세요.","work":"큰 계획보다 매주 지킬 일정과 끝내야 할 분량을 구체적으로 잡아 보세요. 일을 맡을 때는 보상뿐 아니라 반복되는 업무량과 필요한 시간을 함께 따져 보세요."},"편관":{"action":"가장 부담되는 과제 하나에서 막히는 점을 한 줄로 적고, 물어볼 사람에게 질문 하나를 보내 보세요.","headline":"어려운 과제 앞에서는 용기와 대비를 함께","lead":"편관은 전통적으로 도전과 압박을 다루며 어려운 상황에 어떻게 대비할지 살피는 주제로 읽어요.","money":"급하게 결제하라는 요청을 받으면 이유와 기한부터 확인해 보세요. 예상 밖 지출에 쓸 수 있는 금액을 따로 정하면 다른 생활비를 흔들지 않고 판단하기 쉬워요.","people":"강한 말에 바로 맞서거나 무조건 따르기보다 받아들일 수 있는 범위를 말해 주세요. 불편한 부탁에는 답할 시간을 요청해도 괜찮아요.","push":"부담되는 일의 가장 작은 첫 단계를 실행해 보세요.","reduce":"촉박하다는 이유만으로 모든 요청에 즉시 답하는 습관을 줄여 보세요.","work":"부담이 큰 목표는 바로 해결할 부분과 도움받을 부분으로 나눠 보세요. 빨리 끝내라는 요구가 있어도 생략하면 안 되는 확인 절차는 남겨 두세요."},"편인":{"action":"궁금한 주장 하나를 골라 처음 나온 자료와 작성 날짜를 확인해 보세요.","headline":"낯선 관점은 열어 두고 확인할 근거는 가까이","lead":"편인은 전통적으로 낯선 배움과 직관, 익숙한 문제를 다른 각도에서 보는 주제로 읽어요.","money":"희소하거나 특별하다는 설명에 끌릴수록 사용 목적과 실제 구성을 확인해 보세요. 처음 접하는 서비스는 오래 묶이는 결제보다 짧게 써 볼 수 있는지 살펴보세요.","people":"상대의 뜻을 짐작했더라도 사실처럼 단정하기 전에 한 번 물어보세요. 혼자 생각할 시간이 필요하다면 연락을 피하기보다 언제 다시 이야기할지 알려 주세요.","push":"익숙한 문제에 다른 분야의 방법 하나를 적용해 보세요.","reduce":"상대의 짧은 반응에 여러 숨은 뜻을 붙이는 일을 줄여 보세요.","work":"평소와 다른 분야의 방법을 가져오되 지금 과제에 쓸 수 있는 부분만 작게 시험해 보세요. 느낌이 좋다는 이유만으로 바꾸기보다 기존 방식과 결과를 비교할 기준을 정해 보세요."},"편재":{"action":"관심 있는 제안 하나의 시작 비용, 주당 소요 시간, 취소 조건을 세 줄로 적어 보세요.","headline":"새 기회는 넓게 보되 쓸 수 있는 한도 안에서","lead":"편재는 전통적으로 바깥의 기회와 거래를 살피며 돈과 시간, 사람을 어떻게 배분할지 생각하는 주제로 읽어요.","money":"새 제안을 볼 때 비용 상한과 취소할 수 있는 조건을 먼저 정해 보세요. 기대하는 이익만 듣지 말고 추가로 들어갈 돈과 시간을 확인해 보세요.","people":"여러 사람과 알아가는 즐거움과 한 사람에게 지킬 약속을 구분해 보세요. 가볍게 한 말도 상대에게는 약속으로 들릴 수 있으니 가능한 범위를 분명히 말해 주세요.","push":"관심 있는 기회 두 가지를 같은 기준으로 비교해 보세요.","reduce":"놓치기 아까워서 확인하지 않은 제안까지 받아들이는 일을 줄여 보세요.","work":"여러 제안을 볼 때는 흥미뿐 아니라 준비 시간과 실제 맡을 역할을 함께 비교해 보세요. 새 일을 하나 고르면 기존 일 중 무엇을 줄일지도 정하는 편이 좋아요."}}},"STEM_DESC":{"갑":"갑목(甲木, 큰   var leap2027=(gy%4===0&&gy%100!==0)||gy%400===0;
  var monthDays2027=[31,leap2027?29:28,31,30,31,30,31,31,30,31,30,31];
  if(gy<1||gm<1||gm>12||gd<1||gd>monthDays2027[gm-1])throw new Error("y2027_bad_date");
  timeStr=(typeof timeStr==="string")?timeStr:""; if(timeStr&&!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(timeStr))throw new Error("y2027_bad_time");
  var jasi=(opts&&opts.jasi==="ya"&&isJasi(timeStr))?"ya":"jeong"; /* 자시(23:30~) 출생이 아니면 설정은 결과에 영향 없음 → 정자시로 정규화 */
  var P=fourPillars(dateStr,timeStr,jasi);
  var dayS=P.d.s, stem=STEMS[dayS];
  var st=strength(P), rel=relation(P), el=elements(P);
  var sin=sinsin(dayS,SE_STEM);
  var stemRel=(dayS===8)?"정임합(丁壬合)":(dayS===9)?"정계충(丁癸沖)":"";
  var k1=stem+(st.cls==="신강"?"강":"약");
  var cell=D.CELLS[k1][rel.cls], pick=cell&&cell[el.fill];
  if(!pick)throw new Error("y2027_unreachable_cell");
  var idiom=pick[0], reason=pick[1], hanja=D.POOL[idiom][0], meaning=D.POOL[idiom][1];
  var key=k1+"-"+rel.cls+"-"+el.fill;
  var missingTxt=el.fillEls.map(function(e){return ELK[e];}).join("·");
  var why=[
    fill(D.OPEN,{stemDesc:D.STEM_DESC[stem],theme:D.THEME[stem]}),
    fill(D.STRENGTH_PREFIX,{cls2:st.cls==="신강"?"센":"약한",cls:st.cls,score:String(st.score)})+" "+D.STRENGTH[k1],
    fill(D.REL_TEXT[rel.cls],{src:rel.srcText,wa:rel.wa,kind:rel.kind}),
    fill(D.CONCLUDE[el.fill],{missing:missingTxt,idiom:idiom,hanja:hanja,why:reason})
  ];
  var chips=["일간 "+stem+"("+HJS[dayS]+")·"+SEL[dayS], st.cls+" "+st.score+"점/"+st.max,
    "세운 정(丁) → "+sin+(stemRel?" · "+stemRel:""),
    rel.cls==="없음"?"미(未) · 일지·월지와 합충 없음":"미(未) ↔ "+rel.srcText+" "+rel.kind,
    el.fill==="채움"?(missingTxt+" 없음 → 2027이 채움"):"화·토 이미 있음", "12운성 "+D.UNSEONG[stem]];
  if(!P.h)chips.push("시주 미상(시지 제외)");
  var basisText="일간 "+stem+"("+HJS[dayS]+") · "+st.cls+" "+st.score+"점 · 세운 정(丁)="+sin+(stemRel?"·"+stemRel:"")+" · 미(未)"+(rel.cls==="없음"?" 합충 없음":"↔"+rel.srcText+" "+rel.kind)+" · 오행 "+(el.fill==="채움"?missingTxt+" 없음→채움":"화·토 있음")+" · 12운성 "+D.UNSEONG[stem];
  return {year:YEAR, rule:RULE, key:key, idiom:idiom, hanja:hanja, meaning:meaning,
    title:"2027 정미년 · 나의 사자성어", summary:D.REL_SHORT[rel.cls]+"의 해 · "+sin+"운",
    why:why, commentary:why.join(" "),
    basis:{ilgan:{stem:stem,hanja:HJS[dayS],el:SEL[dayS],desc:D.STEM_DESC[stem]},
      strength:st, sewoon:{stem:"정",branch:"미",sin:sin,stemRel:stemRel,unseong:D.UNSEONG[stem],unseongText:D.UNSEONG_TEXT[stem]},
      relation:rel, elements:el, chips:chips, basisText:basisText},
    pillars:{y:pnh(P.y),m:pnh(P.m),d:pnh(P.d),h:P.h?pnh(P.h):null},
    input:{date:dateStr,time:timeStr,jasi:jasi}};
}

/* Fixed annual report. Day-master strength is separate from ten-god strength. */
function report(r){
  if(!r||r.year!==YEAR||r.rule!==RULE||!r.basis||!r.basis.sewoon)throw new Error("y2027_bad_result");
  var sin=r.basis.sewoon.sin, rel=r.basis.relation.cls;
  var groups={"비견":"비겁","겁재":"비겁","식신":"식상","상관":"식상","정재":"재성","편재":"재성","정관":"관성","편관":"관성","정인":"인성","편인":"인성"};
  var t=D.REPORT.themes[sin], x=D.REPORT.relations[rel], flag=r.basis.strength.cls==="신강"?"강":"약";
  var handling=D.REPORT.strength[groups[sin]][flag];
  if(!t||!x||!handling)throw new Error("y2027_bad_report_key");
  return {version:"2027.v2-r1",key:r.key,headline:t.headline,lead:t.lead,
    personalBasis:r.basis.ilgan.desc+" · "+r.basis.strength.cls+" "+r.basis.strength.score+"점 · 2027년 "+sin+" · "+rel,
    areas:[{id:"work",title:"일·공부",text:t.work+" "+handling.work},{id:"money",title:"돈·소비",text:t.money+" "+x.money},{id:"people",title:"사람·연애",text:t.people+" "+x.people}],
    push:[t.push,handling.push],reduce:[t.reduce,x.reduce],
    actions:[t.action,x.action,"위 두 행동 중 지금 할 수 있는 하나를 고르고, 이번 주에 실행할 날짜를 달력에 적어 보세요."],
    relationNote:x.frame,fillNote:D.REPORT.fill[r.basis.elements.fill],
    scoreNote:"신강·신약 점수는 사주의 기운을 나누는 분류 기준이지, 운이 좋은 정도나 개인의 능력 점수가 아니에요.",
    limitation:"고정 날짜 절기와 30분 일괄 보정을 쓰는 간소화 해석이에요. 조후·격국·용신·대운을 모두 따지는 전문 감정이나 실제 미래의 보장은 아니며, 중요한 결정은 현실의 정보와 함께 판단해 주세요."};
}

return {YEAR:YEAR, RULE:RULE, compute:compute, report:report, fourPillars:fourPillars, sinsin:sinsin, strength:strength, relation:relation, elements:elements, isJasi:isJasi, DATA:D, CELL_COUNT:Object.keys(D.POOL).length};
})();

let cal="solar", sex="f", lastCtx=null;

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* 하루 2회 제한 */
const DAILY_MAX=3;
function todayKey(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function getQuota(){try{const r=JSON.parse(localStorage.getItem("lolo_mysaju_q")||"{}");return r.d===todayKey()?r.n||0:0;}catch(e){return 0;}}
function useQuota(){try{localStorage.setItem("lolo_mysaju_q",JSON.stringify({d:todayKey(),n:getQuota()+1}));}catch(e){}updateQuotaUI();}
function quotaLeft(){return Math.max(0,DAILY_MAX-getQuota());}
function updateQuotaUI(){$("quota").innerHTML=(quotaLeft()>0?("오늘 남은 질문 "+"🌙".repeat(quotaLeft())+'<span style="opacity:.35">'+"🌙".repeat(DAILY_MAX-quotaLeft())+"</span>")
  :"오늘의 질문 세 번을 다 썼어요 · 내일 다시 만나요 🌙")
  +'<br><span style="font-size:.72rem;opacity:.8">환절기 감기 조심하세요.</span>'
    ;}
updateQuotaUI();

function toSolar(dateStr, leap){
  const [y,m,d]=dateStr.split("-").map(Number);
  try{
    const KLC=(typeof KoreanLunarCalendar!=="undefined")?KoreanLunarCalendar:(window.KoreanLunarCalendar);
    const c=new KLC();
    if(!c.setLunarDate(y,m,d,!!leap))return null;
    const s=c.getSolarCalendar();
    if(!s||!s.year)return null;
    return s.year+"-"+String(s.month).padStart(2,"0")+"-"+String(s.day).padStart(2,"0");
  }catch(e){return null;}
}

$("btnGo").onclick=()=>{
  if(isClosed()){closedView();return;}
  $("formErr").style.display="none";
  if(quotaLeft()<=0){formError("오늘의 질문 세 번을 다 썼어요. 내일 또 봐요 🌙");return;}
  const d1=$("d1").value, q=$("q").value.trim();
  if(!d1){formError("생년월일을 입력해줘요.");return;}
  if(!q){formError("지금의 고민을 한 문장으로 적어줘요.");$("q").focus();return;}
  let solar=d1, origNote="";
  if(cal==="lunar"){
    solar=toSolar(d1,$("leap").checked);
    if(!solar){formError("음력 날짜를 변환하지 못했어요. 날짜를 확인해줘요.");return;}
    origNote="음력 "+d1+($("leap").checked?"(윤달)":"")+" → 양력 "+solar;
  }
  const today=new Date().toISOString().slice(0,10);
  if(solar>today){formError("미래에서 오셨나요? 생년월일을 확인해줘요.");return;}
  lastCtx={name:($("n1").value.trim()||"나").slice(0,10),date:solar,origNote,
    time:$("t1").value||"",sex,region:"",q:q.slice(0,200),focus,jasi:(isJasiTime($("t1").value)?jasi1:"jeong")};
  show("stepLoad");
  interpret();
};

async function interpret(){
  try{
    const res=await fetch("/api/mysaju",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(lastCtx)});
    if(!res.ok){let why="";try{why=(await res.json()).error||"";}catch(e){}throw {st:res.status,why};}
    const data=await res.json();
    const ok=a=>Array.isArray(a)&&a.length===5&&a.every(x=>x&&typeof x.t==="string");
    if(!data||!data.ms||!ok(data.a)||!ok(data.bR)||typeof data.common!=="string"||typeof data.diff!=="string"||!Array.isArray(data.acts))throw 0;
    renderSheet(data);
    useQuota();
    show("stepResult");window.scrollTo({top:0});
  }catch(e){
    show("stepAsk");
    if(e&&e.st===429){formError("지금 명식 보러 온 손님이 많아요! 1분만 쉬었다가 다시 눌러줘요.");return;}
    if(e&&e.st===503){formError("두 학자님이 잠깐 자리를 비우셨어요. 조금 뒤에 다시 와줘요 🌙");return;}
    const st=(e&&e.st)?" [코드 "+e.st+(e.why?"·"+e.why:"")+"]":"";
    formError("연결이 잠깐 흔들렸어요. '두 분께 여쭤볼게요'를 한 번 더 눌러줘요."+st);
  }
}

    +'<div class="who">'+esc(c.name)+' · '+esc(c.date)+(c.time?' '+esc(c.time)+'생'+(isJasiTime(c.time)?(c.jasi==='ya'?' · 야자시(당일)':' · 정자시(다음 날)'):''):' · 시간 미상')+(c.origNote?' · '+esc(c.origNote):'')+(c.region?' · '+esc(c.region):'')+(c.focus&&c.focus!=="all"?' · <b>'+esc(fu.label)+' 중심</b>':'')+'</div></header>'
    +'<div class="ms">'+pils+'</div>'

    +'<div class="syn"><h3>두 학자의 결론</h3>'
    +'<h4>공통으로 동의한 것</h4><p>'+esc(d.common)+'</p>'
    +'<h4>해석이 갈린 부분</h4><p>'+esc(d.diff)+'</p>'
    +'<h4>지금 실천할 행동 3가지</h4><ol>'+d.acts.map(a=>'<li>'+esc(a)+'</li>').join("")+'</ol></div>'
    +'<div class="sfoot">재미로 보는 사주입니다.<br>전문가의 상담이나 조언을 대신하지 않아요.</div>';
}

/* 결과지 이미지 저장 (정직 안내·인앱 감지) */
let storyBlob=null;
async function makeStoryImage(){
  const sheet=$("sheet");
  const cap=await html2canvas(sheet,{scale:2,backgroundColor:"#FBF6EA",logging:false});
  const W=1080,H=1920,c=document.createElement("canvas");c.width=W;c.height=H;
  const g=c.getContext("2d");
  const grad=g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#1A2348");grad.addColorStop(.6,"#0F152A");grad.addColorStop(1,"#0B1020");
  g.fillStyle=grad;g.fillRect(0,0,W,H);
  g.fillStyle="#EAD9A6";
  for(const [x,y,r] of [[90,140,3],[980,120,2.5],[160,1760,2.5],[930,1800,3],[540,70,2],[70,960,2],[1010,1000,2.2]]){g.beginPath();g.arc(x,y,r,0,7);g.fill();}
  const pad=60,sc=Math.min((W-pad*2)/cap.width,(H-pad*2)/cap.height);
  g.save();g.shadowColor="rgba(0,0,0,.55)";g.shadowBlur=48;g.shadowOffsetY=16;
  g.drawImage(cap,(W-cap.width*sc)/2,(H-cap.height*sc)/2,cap.width*sc,cap.height*sc);g.restore();
  return new Promise(res=>c.toBlob(res,"image/png"));
}
$("btnSaveImg").onclick=async()=>{
  const b=$("btnSaveImg");b.disabled=true;const t=b.textContent;b.textContent="결과지 만드는 중…";

    storyBlob=await makeStoryImage();

};
